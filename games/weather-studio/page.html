<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAYANIHanda Weather Studio</title>
<meta name="description" content="A sample BAYANIHanda game: forecast a typhoon on air and learn to read a flood hazard map.">
<!-- Weather Studio, a test game of the BAYANIHanda library. scripts/build-games.mjs copies this page into
     public/games/weather-studio.html with the fonts filled in below (and, with --standalone, into
     games/standalone/Weather-Studio.html with the fonts inside). -->
<!--@FONTS-->
<!--@PEOPLE-->
<style>
/* page basics */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
:root{
  /* Layout: one phone-width column. A TV studio frame tops each step, chunky buttons sit below,
     and Bayani's speech bubble carries every hint. One dark studio look on purpose. */
  --navy:#13283a;--navy-0:rgba(19,40,58,0);--panel:#1d3b52;--panel-hi:#29506e;--frame:#0b1b28;--shadow:rgba(0,0,0,.35);--scrim:rgba(5,14,22,.72);
  --sun:#ffd24d;--sun-edge:#b38a00;--sun-ink:#2e2200;
  --sea:#4fb3e8;--sea-edge:#2a7aa8;--sea-ink:#0b2a3d;
  --land:#8fd47e;--land-edge:#4f9a42;--land-ink:#123d1c;
  --go:#1aa46a;--go-deep:#0f7a4b;--go-edge:#0c6a43;--go-soft:#e5f6ee;--go-ink:#0c5c3a;
  --cta:#d9650a;--cta-edge:#a34a05;
  --ink:#ffffff;--muted:#cfe0ea;--dim:#8fb2c6;
  --paper:#ffffff;--paper-2:#eef3f6;--paper-ink:#13283a;--paper-dim:#4f6577;--paper-line:#cfdae2;
  --nope:#ff9f43;--nope-soft:#fff1e3;--nope-edge:#b3651e;--nope-ink:#9a4200;
  --rec:#c62f22;--rec-edge:#7e1d15;--warn:#ff9c94;
  --low:#ffe14a;--med:#ff9a3c;--high:#e8453b;--high-chip:#cc3529;--low-ink:#4a3a00;--med-ink:#4a2300;
  --rain-y:#ffe066;--rain-y-edge:#b39a2e;--rain-o:#ff9f43;--rain-o-edge:#b3651e;--rain-r:#cc3529;--rain-r-edge:#8e2219;
  --young-bg:#ffeca8;--young-fg:#6b4a00;--older-bg:#ffe0ee;--older-fg:#a3195b;
  --desk:#1f6f8b;
  --map-land:#f3f4ea;--map-hill:#e4ebd6;--map-contour:#b5c49a;--map-road:#ffffff;--map-road-edge:#c2cab6;--map-river:#3c9fd8;--map-sea:#a9d9f1;--map-ink:#13283a;--map-house:#a3b0bb;
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--navy);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:var(--sun);font-weight:900}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.app{max-width:520px;min-height:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-direction:column;gap:12px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:center;gap:10px}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--shadow)}
.ibtn.dark{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--frame)}
.ibtn:active,.rbtn:active,.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--frame)}
.h1{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-wrap:balance}
.h2{margin:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;text-wrap:balance}
.age{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:5px 9px;white-space:nowrap}
.age.young{background:var(--young-bg);color:var(--young-fg)}
.age.older{background:var(--older-bg);color:var(--older-fg)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:9px 14px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--sun);flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.4px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b span{color:var(--sun)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps li{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
.steps i{display:block;height:6px;border-radius:6px;background:var(--panel)}
.steps .done{color:var(--muted)}.steps .done i{background:var(--go)}
.steps .now{color:var(--sun)}.steps .now i{background:var(--sun)}

/* studio */
.studio{position:relative;width:100%;aspect-ratio:342/236;border-radius:22px;overflow:hidden;border:6px solid var(--frame);background:var(--sea);box-shadow:0 6px 0 var(--shadow);flex:none}
.studio.short{aspect-ratio:342/200}
.studio svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sig{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:7px;background:var(--sun);color:var(--paper-ink);border-radius:12px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 var(--shadow);font-size:12px;font-weight:900;line-height:1.05}
.sig b{width:28px;height:28px;border-radius:9px;background:var(--paper-ink);color:var(--sun);display:grid;place-items:center;font-family:var(--display);font-size:19px;font-weight:800;line-height:1;padding-top:2px}
.clock{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:6px;background:var(--frame);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase}
.clock.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec)}
.anchor{position:absolute;left:37%;bottom:20%;width:24%;animation:bob 3.2s ease-in-out infinite}
.anchor svg{display:block;width:100%;height:auto}
.talking .mouth{animation:talk .26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.desk{position:absolute;left:27%;width:44%;bottom:13%;height:10%;background:var(--desk);border-top:4px solid var(--sun);border-radius:6px 6px 0 0}
.lower{position:absolute;left:0;right:0;bottom:0;min-height:13%;background:var(--go-deep);display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
.lower span{font-weight:700;color:var(--go-soft);text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.micstage{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:var(--navy);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--shadow)}
.micdot{width:46px;height:46px;border-radius:50%;background:var(--sun);color:var(--paper-ink);display:grid;place-items:center}
.bars{display:flex;align-items:center;gap:4px;height:40px}
.bars span{width:5px;height:22%;border-radius:3px;background:var(--sun)}
.live .bars span{animation:bar .8s ease-in-out infinite alternate}
.live .bars span:nth-child(2n){animation-duration:.62s}.live .bars span:nth-child(3n){animation-duration:.95s}
.metered .bars span{animation:none!important;transition:height .08s linear}
@keyframes bar{from{height:18%}to{height:96%}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}

.cc{background:var(--frame);border-radius:16px;padding:12px 14px;min-height:62px;font-size:17px;font-weight:800;line-height:1.35;display:flex;align-items:center;gap:10px}
.cc small{flex:none;align-self:flex-start;font-size:10px;font-weight:900;letter-spacing:.8px;color:var(--frame);background:var(--muted);border-radius:6px;padding:2px 5px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:14px}
.rbtn{width:50px;height:50px;border-radius:16px;border:0;background:var(--panel);color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--frame);font-weight:900;font-size:14px}
.rbtn.on{background:var(--go-deep);box-shadow:0 4px 0 var(--go-edge)}
.pbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--sun);color:var(--paper-ink);display:grid;place-items:center;padding:0;box-shadow:0 5px 0 var(--sun-edge)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:900;line-height:1.25}
.fact.sea{background:var(--sea);color:var(--sea-ink);box-shadow:0 4px 0 var(--sea-edge)}
.fact.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-edge)}
.fact.land{background:var(--land);color:var(--land-ink);box-shadow:0 4px 0 var(--land-edge)}

/* dock and buttons */
.dock{position:sticky;bottom:0;z-index:5;margin-top:auto;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--navy-0),var(--navy) 38%)}
.dock:empty{padding:0}
.cta{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:999px;border:0;background:var(--cta);color:var(--ink);font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;box-shadow:0 6px 0 var(--cta-edge);padding:8px 20px;text-align:center}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cta-edge)}
.cta.ghost{background:var(--panel);box-shadow:0 5px 0 var(--frame)}
.cta.go{background:var(--go-deep);box-shadow:0 5px 0 var(--go-edge)}
.cta.small{min-height:52px;font-size:18px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.linkbtn{background:transparent;border:0;color:var(--muted);font-weight:900;font-size:14px;min-height:44px;padding:0 6px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:3px}
.linkbtn.warn{color:var(--warn)}

/* Bayani says */
.say{display:flex;gap:8px;align-items:flex-end}
.say-face{width:52px;flex:none}
.say-face svg{display:block;width:100%;height:auto}
.say-text{flex:1;min-width:0;margin:0;background:var(--paper);color:var(--paper-ink);border-radius:18px 18px 18px 4px;padding:10px 13px;font-size:14.5px;font-weight:800;line-height:1.42;border:3px solid var(--paper)}
.say-text b{font-weight:900}
.say.good .say-text{border-color:var(--go)}.say.good .say-text b{color:var(--go-ink)}
.say.nope .say-text{border-color:var(--nope)}.say.nope .say-text b{color:var(--nope-ink)}
.say-hear{width:42px;height:42px;flex:none;align-self:center;border-radius:12px;border:0;background:var(--panel);color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--frame)}

/* title */
.title-h{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:15.5px;font-weight:700;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;font-weight:900;font-size:14px}
.field input{height:52px;width:100%;border-radius:14px;border:3px solid var(--panel-hi);background:var(--paper);color:var(--paper-ink);font-family:var(--body);font-weight:800;font-size:18px;padding:0 14px}
.field small{font-weight:700;color:var(--dim);font-size:12.5px}
.levels{display:grid;gap:10px}
.level{position:relative;border-radius:20px;border:3px solid var(--panel);background:var(--panel);padding:12px 14px 12px 46px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--frame)}
.level::before{content:"";position:absolute;left:14px;top:15px;width:20px;height:20px;border-radius:50%;border:3px solid var(--dim)}
.level.on{border-color:var(--sun);background:var(--panel-hi)}
.level.on::before{border-color:var(--sun);background:radial-gradient(circle,var(--sun) 45%,transparent 50%)}
.lv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv-top b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1}
.lv-txt{font-size:14px;font-weight:700;color:var(--muted);line-height:1.4}
.lv-note{font-size:12.5px;font-weight:800;color:var(--sun)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.how li{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:900;text-align:center;color:var(--muted)}
.how span{width:44px;height:44px;border-radius:50%;background:var(--panel);color:var(--sun);display:grid;place-items:center}
.aboutrow{display:flex;justify-content:center}

/* build */
.news{background:var(--sun);color:var(--sun-ink);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--sun-edge)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.news p{margin:3px 0 0;font-size:14.5px;font-weight:800;line-height:1.42}
.wall{position:relative;width:100%;aspect-ratio:342/176;border-radius:20px;overflow:hidden;border:6px solid var(--frame);background:var(--sea);flex:none}
.wall svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot-q{font-family:var(--display);font-weight:800;font-size:20px;fill:#ffffff}
.rainchip{position:absolute;left:10px;bottom:10px;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:900;box-shadow:0 3px 0 var(--shadow);background:var(--rain-o);color:var(--med-ink)}
.parts{display:flex;align-items:center;justify-content:space-between;gap:10px}
.parts .h2{flex:1;min-width:0}
.pdots{display:flex;gap:5px;flex:none}
.pdots i{width:12px;height:12px;border-radius:50%;background:var(--panel)}
.pdots i.on{background:var(--sun)}.pdots i.done{background:var(--go)}
.tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stk{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:0;padding:0 0 2px;font-size:11px;font-weight:900;color:var(--ink);text-align:center;line-height:1.1}
.stk-dot{width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.stk.placed{color:var(--sun)}
.stk.placed .stk-dot{opacity:.55}
.stk.tried .stk-dot{opacity:.38}
.stk.tried{color:var(--dim);text-decoration:line-through}
.count{font-size:13.5px;font-weight:800;color:var(--muted);text-align:center}
.sigs{display:grid;gap:8px}
.sigs.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sigs.n5{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sigbtn{min-height:70px;border-radius:18px;border:0;background:var(--panel);color:var(--ink);padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 0 var(--frame)}
.sigbtn b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.sigbtn span{font-size:11px;font-weight:800;color:var(--muted);line-height:1.15;text-align:center}
.sigbtn.right{background:var(--sun);color:var(--paper-ink);box-shadow:0 0 0 3px var(--paper),0 4px 0 var(--sun-edge)}
.sigbtn.right span{color:var(--paper-ink)}
.sigbtn.wrong{opacity:.42}.sigbtn.wrong b{text-decoration:line-through}
.guide-btn{align-self:center}
.guide{width:100%;border-collapse:collapse;background:var(--paper);color:var(--paper-ink);border-radius:14px;overflow:hidden;font-size:12.5px}
.guide th,.guide td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--paper-line);font-variant-numeric:tabular-nums}
.guide th{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--paper-dim);background:var(--paper-2)}
.guide td:first-child{font-family:var(--display);font-weight:800;font-size:16px;width:34px;text-align:center}
.tablewrap{overflow-x:auto;border-radius:14px}
.rains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rainbtn{min-height:64px;border-radius:16px;border:0;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:15px;line-height:1.15;text-align:center}
.rainbtn span{font-size:11.5px;font-weight:800}
.rainbtn.y{background:var(--rain-y);color:var(--sun-ink);box-shadow:0 4px 0 var(--rain-y-edge)}
.rainbtn.o{background:var(--rain-o);color:var(--med-ink);box-shadow:0 4px 0 var(--rain-o-edge)}
.rainbtn.r{background:var(--rain-r);color:var(--ink);box-shadow:0 4px 0 var(--rain-r-edge)}
.rainbtn.right{outline:3px solid var(--paper);outline-offset:2px}
.rainbtn.wrong{opacity:.4}

/* flood map */
.mapbox{position:relative;border-radius:18px;overflow:hidden;border:5px solid var(--paper);background:var(--map-land);box-shadow:0 5px 0 var(--frame);flex:none}
.fmap{display:block;width:100%;height:auto}
.maptitle{position:absolute;left:8px;top:8px;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:3px 8px;font-size:10.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;box-shadow:0 2px 0 var(--map-road-edge);pointer-events:none}
.m-land{fill:var(--map-land)}
.m-hill{fill:var(--map-hill);stroke:var(--map-contour);stroke-width:1.5}
.m-cont{fill:none;stroke:var(--map-contour);stroke-width:1.5}
.z-low{fill:var(--low)}.z-med{fill:var(--med)}.z-high{fill:var(--high)}
.m-river{fill:none;stroke:var(--map-river);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.m-sea{fill:var(--map-sea)}
.m-wave{fill:none;stroke:var(--paper);stroke-width:2;stroke-linecap:round;opacity:.8}
.m-road-e{fill:none;stroke:var(--map-road-edge);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.m-road{fill:none;stroke:var(--map-road);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.m-house{fill:var(--map-house)}
.m-lab{font-family:var(--body);font-weight:900;font-size:10px;letter-spacing:1px;fill:var(--paper-dim)}
.m-rivlab{fill:var(--map-river);font-size:10.5px;letter-spacing:.4px;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.m-north circle{fill:var(--paper);stroke:var(--map-ink);stroke-width:1.5}
.m-north path{fill:var(--map-ink)}
.m-north text{font-family:var(--body);font-weight:900;font-size:8px;fill:var(--map-ink)}
.pin{cursor:pointer;outline:none}
.pin .hit{fill:transparent;pointer-events:all}
.pin .dot{fill:var(--paper);stroke:var(--map-ink);stroke-width:2}
.pin .lbl{font-family:var(--body);font-weight:900;font-size:11.5px;fill:var(--map-ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.4px;stroke-linejoin:round}
.pin .ring{fill:none;stroke:var(--navy);stroke-width:3.5;transform-box:fill-box;transform-origin:center;animation:pulse 1.25s ease-out infinite}
.pin.sel .dot{stroke:var(--navy);stroke-width:3.5}
.pin.ok .dot{stroke:var(--go);stroke-width:4}
.pin.no .dot{stroke:var(--nope);stroke-width:4}
.pin:focus-visible .dot{stroke:var(--cta);stroke-width:4.5}
.pin .evac rect{fill:var(--go-deep)}
.pin .evac text{font-family:var(--body);font-weight:900;font-size:9px;letter-spacing:.5px;fill:var(--paper)}
.route{cursor:pointer}
.route .case{fill:none;stroke:var(--paper);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.route .line{fill:none;stroke:var(--map-ink);stroke-width:4.5;stroke-dasharray:9 7;stroke-linecap:round;stroke-linejoin:round}
.route.sel .line{stroke:var(--nope-ink);stroke-width:5.5}
.route.best .line{stroke:var(--go-deep);stroke-width:6;stroke-dasharray:none}
.route.faded{opacity:.3}
.rtag{cursor:pointer;outline:none}
.rtag circle{fill:var(--map-ink);stroke:var(--paper);stroke-width:2.5}
.rtag text{font-family:var(--display);font-weight:800;font-size:13px;fill:var(--paper)}
.rtag:focus-visible circle{stroke:var(--cta);stroke-width:4}
.best .rtag circle,.rtag.best circle{fill:var(--go-deep)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:900}
.legend .lg-t{width:100%;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--paper-dim)}
.legend .sw{display:inline-flex;align-items:center;gap:6px}
.legend .sw i{width:20px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid var(--paper-line)}
.sw .lo{background:var(--low)}.sw .me{background:var(--med)}.sw .hi{background:var(--high)}.sw .no{background:var(--map-land)}
.mapnote{margin:-4px 0 0;font-size:12.5px;font-weight:700;color:var(--dim);line-height:1.4}
.pininfo{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:9px 12px;border:3px solid var(--sun)}
.pininfo .pi-ic{width:36px;height:36px;flex:none;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;color:var(--paper-ink)}
.pininfo .pi-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pininfo b{font-size:15px;font-weight:900;line-height:1.15}
.pininfo small{font-size:12.5px;font-weight:700;color:var(--paper-dim)}
.zchip{align-self:flex-start;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900;margin-top:2px}
.zchip.high{background:var(--high-chip);color:var(--ink)}.zchip.med{background:var(--med);color:var(--med-ink)}.zchip.low{background:var(--low);color:var(--low-ink)}.zchip.none{background:var(--paper-2);color:var(--paper-ink);border:1.5px solid var(--paper-line)}
.choices{display:grid;gap:10px}
.choice{min-height:56px;width:100%;border-radius:18px;border:3px solid transparent;background:var(--panel);color:var(--ink);padding:10px 14px;text-align:left;font-weight:900;font-size:15px;line-height:1.3;box-shadow:0 4px 0 var(--frame);display:flex;align-items:center;gap:10px}
.choice .mark{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.choice.right{background:var(--paper);color:var(--paper-ink);border-color:var(--go);box-shadow:0 4px 0 var(--go-edge)}
.choice.right .mark{background:var(--go);color:var(--ink)}
.choice.wrong{background:var(--nope-soft);color:var(--paper-ink);border-color:var(--nope);box-shadow:0 4px 0 var(--nope-edge)}
.choice.wrong .mark{background:var(--nope);color:var(--ink)}
.lgq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lgq button{min-height:58px;border-radius:16px;border:0;font-weight:900;font-size:16px}
.lgq .hi{background:var(--high-chip);color:var(--ink);box-shadow:0 4px 0 var(--rain-r-edge)}
.lgq .me{background:var(--med);color:var(--med-ink);box-shadow:0 4px 0 var(--nope-edge)}
.lgq .lo{background:var(--low);color:var(--low-ink);box-shadow:0 4px 0 var(--rain-y-edge)}
.lgq .wrong{opacity:.4;text-decoration:line-through}
.lgq .right{outline:3px solid var(--paper);outline-offset:2px}
.sorts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sorts button{min-height:58px;border-radius:16px;border:0;font-weight:900;font-size:14px;line-height:1.1;padding:4px}
.sorts .hi{background:var(--high-chip);color:var(--ink);box-shadow:0 4px 0 var(--rain-r-edge)}
.sorts .me{background:var(--med);color:var(--med-ink);box-shadow:0 4px 0 var(--nope-edge)}
.sorts .lo{background:var(--low);color:var(--low-ink);box-shadow:0 4px 0 var(--rain-y-edge)}
.sorts .no{background:var(--paper);color:var(--paper-ink);box-shadow:0 4px 0 var(--paper-line)}
.sorts .wrong{opacity:.4;text-decoration:line-through}
.routes{display:grid;gap:8px}
.routes button{min-height:56px;border-radius:16px;border:3px solid transparent;background:var(--panel);color:var(--ink);font-weight:900;font-size:15px;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;box-shadow:0 4px 0 var(--frame)}
.routes button i{font-style:normal;width:30px;height:30px;flex:none;border-radius:50%;background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;font-family:var(--display);font-size:17px;font-weight:800}
.routes button small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.routes .wrong{border-color:var(--nope);background:var(--nope-soft);color:var(--paper-ink);box-shadow:0 4px 0 var(--nope-edge)}
.routes .wrong small{color:var(--paper-dim)}
.routes .right{border-color:var(--go);background:var(--paper);color:var(--paper-ink);box-shadow:0 4px 0 var(--go-edge)}
.routes .right small{color:var(--paper-dim)}
.donecard{background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 var(--go-edge);border:3px solid var(--go)}
.dc-top{display:flex;align-items:center;gap:12px}
.dc-top .medal{width:52px;height:52px;flex:none;border-radius:50%;background:var(--go-deep);color:var(--ink);display:grid;place-items:center;border:3px solid var(--go-soft)}
.donecard .eyebrow{color:var(--go-ink)}
.donecard ul{margin:0;padding-left:20px;display:grid;gap:4px;font-weight:800;font-size:14.5px;line-height:1.4}
.donecard p{margin:0;font-size:14px;font-weight:700;line-height:1.45}
.donecard a{color:var(--cta-edge)}
.donecard .small{font-size:12.5px;color:var(--paper-dim)}
.side{display:block;width:100%;height:auto;border-radius:12px;border:2px solid var(--paper-line)}
.cap{font-size:12.5px!important;color:var(--paper-dim)}

/* advise */
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:900;line-height:1.2}
.pill.sigp{background:var(--sun);color:var(--paper-ink);padding:3px 10px 3px 3px}
.pill.sigp b{width:24px;height:24px;border-radius:7px;background:var(--paper-ink);color:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.pill.orange{background:var(--rain-o);color:var(--med-ink)}
.pill.mapp{background:var(--paper);color:var(--paper-ink)}
.pill.mapp i{width:12px;height:12px;border-radius:3px;background:var(--high)}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;font-weight:800;color:var(--muted)}
.gdots{display:flex;gap:5px}
.gdots i{width:13px;height:13px;border-radius:50%;background:var(--panel)}
.gdots i.on{background:var(--go)}
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tip{position:relative;min-height:106px;border-radius:18px;border:3px solid transparent;background:var(--panel);color:var(--ink);padding:10px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;box-shadow:0 4px 0 var(--frame)}
.tip .ti{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--sea);display:grid;place-items:center}
.tip b{font-size:14px;font-weight:900;line-height:1.24}
.tip.right{background:var(--paper);color:var(--paper-ink);border-color:var(--go);box-shadow:0 4px 0 var(--go-edge)}
.tip.right .ti{background:var(--go-soft);color:var(--go-ink)}
.tip.wrong{background:var(--nope-soft);color:var(--paper-ink);border-color:var(--nope);box-shadow:0 4px 0 var(--nope-edge)}
.tip.wrong .ti{background:var(--paper);color:var(--nope-ink)}
.tip .flag{position:absolute;right:-6px;top:-8px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900;border:3px solid var(--navy)}
.tip.right .flag{background:var(--go-deep);color:var(--ink);width:30px;height:30px;padding:0;display:grid;place-items:center}
.tip.wrong .flag{background:var(--nope-ink);color:var(--ink)}

/* present */
.onair{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--ink);background:var(--rec);border-radius:999px;padding:6px 11px;box-shadow:0 3px 0 var(--rec-edge);font-variant-numeric:tabular-nums}
.onair::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--paper)}
.onair.prac{background:var(--panel-hi);box-shadow:0 3px 0 var(--frame)}
.cue{background:var(--frame);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cue .eyebrow{color:var(--dim)}
.cue p{margin:0;font-size:15px;font-weight:800;line-height:1.38;color:var(--ink)}
.cue p.past{color:var(--dim)}
.cue p.now{font-family:var(--display);font-size:21px;line-height:1.2;color:var(--sun)}
.nextline{align-self:stretch;min-height:50px;border-radius:14px;border:0;background:var(--sun);color:var(--paper-ink);font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--sun-edge);display:flex;align-items:center;justify-content:center;gap:6px}
.recrow{display:flex;align-items:center;justify-content:center;gap:18px}
.recrow .side-b{width:96px;display:flex;justify-content:center}
.recbtn{width:84px;height:84px;flex:none;border-radius:50%;border:6px solid var(--paper);background:var(--rec);display:grid;place-items:center;box-shadow:0 6px 0 var(--frame);padding:0}
.recbtn i{display:block;width:30px;height:30px;border-radius:50%;background:var(--paper)}
.recbtn.stop i{width:26px;height:26px;border-radius:5px}
.recbtn.done{background:var(--go-deep)}
.recbtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--frame)}
.tlabel{font-size:13px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.smallbtn{min-height:48px;border-radius:16px;border:0;background:var(--panel);color:var(--ink);font-weight:900;font-size:14px;padding:0 14px;box-shadow:0 4px 0 var(--frame)}
.privacy{margin:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--muted);text-align:center}
.nomic{background:var(--panel);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.nomic p{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--muted)}
.nomic b{color:var(--ink)}

/* wrap */
.wbar{display:flex;align-items:center;gap:10px}
.wbar div{flex:1;height:8px;border-radius:8px;background:var(--panel);overflow:hidden}
.wbar div i{display:block;height:100%;width:0;background:var(--sun);border-radius:8px}
.wbar span{font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.badges{display:grid;gap:10px}
.badge{position:relative;background:var(--sun);color:var(--sun-ink);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 var(--sun-edge);overflow:hidden}
.badge.map{background:var(--land);color:var(--land-ink);box-shadow:0 5px 0 var(--land-edge)}
.badge .medal{width:58px;height:58px;flex:none;border-radius:50%;background:var(--paper-ink);color:var(--sun);display:grid;place-items:center;border:4px solid var(--paper)}
.badge.map .medal{color:var(--land)}
.badge b{display:block;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05}
.badge p{margin:2px 0 0;font-size:13px;font-weight:800;line-height:1.35}
.note{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:18px;padding:12px 14px;font-size:14px;font-weight:800;line-height:1.4;color:var(--muted)}
.note span.ni{width:36px;height:36px;flex:none;border-radius:50%;background:var(--navy);color:var(--land);display:grid;place-items:center}
.wrapbtns{display:flex;flex-direction:column;gap:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.keptmsg{margin:0;font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center;text-align:center}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:24px 24px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.sh-h{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.sh-h3{margin:6px 0 0;font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--paper-dim)}
.sh-p{margin:0;font-size:14.5px;font-weight:700;line-height:1.5}
.sh-list{margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px;font-weight:700;line-height:1.45}
.sh-list a{color:var(--cta-edge)}
.sel{user-select:all;-webkit-user-select:all;font-weight:900}
.sh-btn{min-height:52px;border-radius:999px;border:0;background:var(--cta);color:var(--ink);font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--cta-edge)}
.sh-btn.ghost{background:var(--paper-2);color:var(--paper-ink);box-shadow:0 4px 0 var(--paper-line)}
.gate{display:flex;flex-direction:column;gap:8px;background:var(--paper-2);border-radius:18px;padding:12px}
.kq{font-size:13px;font-weight:900;color:var(--paper-dim);text-align:center}
.kq.big{font-family:var(--display);font-size:28px;font-weight:800;color:var(--paper-ink)}
.kdisp{height:52px;border-radius:14px;background:var(--navy);color:var(--sun);display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums}
.kbad{margin:0;text-align:center;font-weight:900;color:var(--nope-ink);font-size:14px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:54px;border-radius:14px;border:0;background:var(--paper);color:var(--paper-ink);font-family:var(--display);font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--paper-line)}
.key.ok{background:var(--go-deep);color:var(--ink);box-shadow:0 3px 0 var(--go-edge)}

/* one-shot effects */
.shake{animation:shake .42s ease-in-out}
.pin.shake .pin-in{animation:shake .42s ease-in-out}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.7);opacity:0}}

@media (max-width:380px){
  .tray{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}
  .sigs.n5 .sigbtn span{font-size:10px}
  .how li{font-size:10px}
}
@media (min-width:560px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

    },
    rec: function () {
      if (S.present.mode === 'rec') return;
      if (!micAllowedHere()) { noMic(); return; }
      if (!S.okRec) { openGate('rec', function () { S.okRec = true; startRecording(); }); return; }
      startRecording();
    },
    stop: function () { stopRecording(); },
    cancel: function () {
      var p = S.present;
      if (p.mode === 'rec') { REC.discard = true; stopRecording(); }
      if (p.mode === 'practice') stopPractice();
      p.mode = 'idle'; p.line = 0; p.t = 0; p.times = [];
      say('present', { text: 'No problem. Take a breath and start again when you are ready.' });
      render();
    },
    nextline: function () {
      var p = S.present, n = cueLines().length;
      if (p.mode !== 'rec' && p.mode !== 'practice') return;
      if (p.line < n - 1) { p.line++; p.times.push((performance.now() - REC.t0) / 1000); }
      render();
    },
    practice: function () { startPractice(); },
    finish: function () { stopPractice(); dropRec(); go('wrap'); },
    clip: function () {
      var pick = function () { var c = $('#clip'); if (c) c.click(); };
      if (!S.okRec) { openGate('clip', function () { S.okRec = true; pick(); }); return; }
      pick();
    },
    play: function () {
      var w = S.wrap;
      if (S.rec && S.rec.url) {
        var a = $('#playback');
        if (!a.paused) { a.pause(); return; }
        if (a.getAttribute('src') !== S.rec.url) a.setAttribute('src', S.rec.url);
        if (a.ended) a.currentTime = 0;
        var pr = a.play();
        if (pr && pr.catch) pr.catch(function () { say('wrap', { tone: 'nope', lead: 'Hmm.', text: 'This recording could not play here.' }); render(); });
        return;
      }
      if (w.playing) { readGen++; TTS.stop(); w.playing = false; w.line = -1; updWrap(); return; }
      readBack();
    },
    keep: function () { S.wrap.kept = true; sfx('good'); render(); },
    del: function () { dropRec(); S.wrap.playing = false; S.wrap.line = -1; S.wrap.msg = 'Your recording is deleted.'; render(); },
    retry: function () { dropRec(); go('present'); },
    restart: function () { stopMedia(); fresh(); go(EMBED ? 'watch' : 'title'); },
    key: function (d) { var g = S.sheet; if (!g || g.kind !== 'gate' || g.entry.length >= 3) return; g.entry += String(d); g.wrong = false; render(); },
    bksp: function () { var g = S.sheet; if (!g || g.kind !== 'gate') return; g.entry = g.entry.slice(0, -1); render(); },
    ok: function () {
      var g = S.sheet;
      if (!g || g.kind !== 'gate') return;
      if (g.entry && Number(g.entry) === g.a * g.b) {
        var fn = gateThen; gateThen = null; S.sheet = null; sfx('good'); render();
        if (fn) fn();
      } else {
        g.wrong = true; g.entry = ''; g.a = rnd(3, 9); g.b = rnd(6, 9); sfx('bad'); render();
      }
    },
    easy: function () { S.sheet = null; gateThen = null; S.level = 'easy'; beginGame(); }
  };

  /* ===== Events ===== */
  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!t || t.getAttribute('aria-disabled') === 'true' || t.disabled) return;
      var act = t.getAttribute('data-act');
      if (act === 'scrim' && e.target !== t) return;
      if (t.tagName === 'A') return;
      var fn = ACT[act];
      if (fn) { e.preventDefault(); fn(t.getAttribute('data-arg')); }
    });
    document.addEventListener('keydown', function (e) {
      var t = e.target;
      if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON' && t.getAttribute('data-act')) {
        e.preventDefault();
        var fn = ACT[t.getAttribute('data-act')];
        if (fn) fn(t.getAttribute('data-arg'));
        return;
      }
      if (S.sheet && e.key === 'Escape') { closeSheet(); return; }
      if (S.sheet && S.sheet.kind === 'gate') {
        if (/^[0-9]$/.test(e.key)) { e.preventDefault(); ACT.key(e.key); }
        else if (e.key === 'Backspace') { e.preventDefault(); ACT.bksp(); }
        else if (e.key === 'Enter' && t && t.tagName !== 'BUTTON') { e.preventDefault(); ACT.ok(); }
      }
    });
    document.addEventListener('input', function (e) { if (e.target && e.target.id === 'nick') S.name = e.target.value; });
    // Leaving the page (or the library closing its frame) stops Bayani's voice and any recording.
    window.addEventListener('pagehide', function () { stopMedia(); });
    // For the tests (games/tests/weather-studio.test.cjs): the game's state, the map's zones and the actions.
    window.__weather = { state: function () { return S; }, zone: zoneOf, embed: EMBED, act: ACT };
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'nick') { e.preventDefault(); ACT.start(); } });
    bindAudio();
  }

  /* ===== Boot (keeps progress if the page is updated while open) ===== */
  function snapshot() {
    var screen = S.screen === 'present' || S.screen === 'wrap' ? 'advise' : S.screen;
    return JSON.parse(JSON.stringify({ screen: screen, level: S.level, name: S.name, sound: S.sound, cc: S.cc, okHard: S.okHard, okRec: S.okRec, build: S.build, map: S.map, advise: S.advise }));
  }
  var booted = false;
  function boot(data) {
    if (booted) return;
    booted = true;
    fresh();
    try {
      if (data && data.screen && SCREENS[data.screen]) {
        ['level', 'name', 'sound', 'cc', 'okHard', 'okRec'].forEach(function (k) { if (data[k] !== undefined) S[k] = data[k]; });
        ['build', 'map', 'advise'].forEach(function (k) { if (data[k]) S[k] = Object.assign(S[k], data[k]); });
        S.screen = data.screen === 'watch' ? 'watch' : data.screen;
      }
    } catch (e) { S.screen = 'title'; }
    bind();
    if (EMBED) {
      S.level = params.get('level') === 'hard' ? 'hard' : 'easy';
      S.sound = params.get('sound') !== '0';
      S.voice = params.get('voice') !== '0';
      S.name = cleanName(params.get('name') || '') || S.name;
      S.okHard = true; // the library already asked for a grown-up when the player's age called for one
      fresh();
      go('watch');
      return;
    }
    render();
  }
  var hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(snapshot); } catch (e) { /* ignore */ }
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(boot); } catch (e) { boot({}); }
    setTimeout(function () { boot({}); }, 1500);
  } else {
    boot((hot && hot.data) || {});
  }
})();
</script>
