<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handa vs. Hazard Bayanihan Mode</title>
<meta name="description" content="Handa vs. Hazard for 2 to 4 players on one phone: pass it around, stack Before, During and After cards, and keep Barangay Handa safe together or in teams.">
<!-- Bayanihan Mode, Handa vs. Hazard for 2 to 4 players: a test game of the BAYANIHanda library.
     scripts/build-games.mjs copies this page into public/games/bayanihan-mode.html with the fonts filled in below
     and the rules from engine.js in the ENGINE slot (and, with --standalone, into
     games/standalone/Bayanihan-Mode.html with the fonts inside). -->
<!--@FONTS-->
<!--@PEOPLE-->
<style>
/* page basics */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one phone on the table. The shared board sits on top, the hand of whoever holds the phone below it, and the
   big orange button at the thumb. The look is the BAYANIHanda library's own: sky background, white cards that sit on
   a soft ledge, Baloo 2 for headings, Nunito for everything else, and the four pillar colors. */
:root{
  --sky:#eef6fa;--sky-2:#cfe6ef;--ink:#16303f;--ink-2:#25404e;--ink-3:#3d5563;--muted:#4f6572;--line:#d5e3ea;--chip:#eef3f6;--paper:#ffffff;
  --cta:#d9650a;--cta-edge:#a34a05;--off:#b9ccd8;--off-edge:#9fb3c2;--link:#a84d04;
  --before:#128253;--before-tint:#e5f6ee;--during:#b35205;--during-tint:#fff1e3;--after:#7a53c6;--after-tint:#f1ebfd;
  --wild:#ffc53d;--wild-ink:#6b4a00;--gold:#ffd24d;--gold-edge:#eaa100;
  --hz:#8e2a1f;--hz-2:#c0392b;--hz-tint:#fdecea;--ok:#128253;--ok-tint:#e5f6ee;--bad:#c62f22;--bad-tint:#fdecea;
  --agila:#2a6b8f;--agila-tint:#e6f3f9;--kalabaw:#b35205;--kalabaw-tint:#fff1e3;
  --young-bg:#ffeca8;--young-fg:#6b4a00;--older-bg:#ffe0ee;--older-fg:#a3195b;--test-bg:#f1ebfd;--test-fg:#5a3a9e;--test-line:#7a53c6;
  --note-bg:#fff5df;--note-line:#ffe2a8;--note-ink:#5c4000;--scrim:rgba(22,48,63,.5);
  --display:'Baloo 2',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;--body:Nunito,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ledge:0 4px 0 rgba(20,48,66,.08);--ledge-2:0 5px 0 rgba(20,48,66,.1);
  color-scheme:light;
}
body{margin:0;min-height:100%;background:radial-gradient(120% 70% at 50% -10%,var(--sky),var(--sky-2)) fixed;background-color:var(--sky);color:var(--ink);font:700 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.locked{overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid #ffd873;outline-offset:2px}
input{font:inherit;-webkit-user-select:text;user-select:text}
a{color:var(--link)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 132px;display:flex;flex-direction:column;gap:14px}
.h1{margin:0;font:800 28px/1.05 var(--display);text-wrap:balance}
.h2{margin:0;font:800 21px/1.1 var(--display);text-wrap:balance}
.lede{margin:0;color:var(--ink-3);font-weight:700}
.small{font-size:13px;font-weight:700;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.bar{display:flex;align-items:center;gap:10px}
.sq{width:48px;height:48px;flex:none;border-radius:16px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;color:var(--ink)}
.sq:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.grow{flex:1;min-width:0}
.roundchip{font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.big{font-size:12px;padding:4px 10px}
.chip.test{background:var(--test-bg);color:var(--test-fg);border:1.5px dashed var(--test-line)}
.chip.young{background:var(--young-bg);color:var(--young-fg)}
.chip.older{background:var(--older-bg);color:var(--older-fg)}
.chip.b{background:var(--before);color:#fff}.chip.d{background:var(--during);color:#fff}.chip.a{background:var(--after);color:#fff}
.chip.agila{background:var(--agila-tint);color:var(--agila)}.chip.kalabaw{background:var(--kalabaw-tint);color:var(--kalabaw)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* the game's banner, as on the library's game intro */
.hero{border-radius:28px;color:#fff;padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.12);background:linear-gradient(135deg,#1e9c66,#0c5c3a)}
.hero .tile{width:86px;height:86px;border-radius:26px;background:var(--paper);display:grid;place-items:center;font-size:48px;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.hero .copy{flex:1 1 220px;min-width:0}
.hero .pillars{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:rgba(0,0,0,.24);border-radius:999px;padding:4px 10px}
.hero .t{font:800 30px/1.02 var(--display);margin-top:8px}
.hero .sub{font:800 17px/1.2 var(--display);opacity:.95;margin-top:2px}
.hero p{margin:6px 0 10px;font-size:15px;font-weight:700;line-height:1.45}

/* Bayani */
.bay{display:flex;align-items:flex-end;gap:10px}
.bay .m{flex:none;width:56px}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:11px 48px 11px 14px}
.bubble .lab{font-size:11.5px;font-weight:900;letter-spacing:1px;color:#7a5400;text-transform:uppercase}
.bubble p{margin:2px 0 0;font-weight:700;font-size:15px;line-height:1.45;text-wrap:pretty}
.bubble b{font-weight:900}
.bubble.good{border-color:#9fdcbf;background:var(--ok-tint)}.bubble.bad{border-color:#f3b4ad;background:var(--bad-tint)}.bubble.nope{border-color:var(--note-line);background:var(--note-bg)}
.bubble .hear{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:50%;background:var(--sky);display:grid;place-items:center;color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){.bob{animation:bob 2.8s ease-in-out infinite}.shake{animation:shake .4s}.pop{animation:pop .35s ease-out}.flip{animation:flip .45s ease-out both}.glow{animation:glow 1.6s ease-in-out infinite}.up{animation:up .3s cubic-bezier(.2,.9,.3,1.15) both}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--gold-edge),0 0 0 0 rgba(255,197,61,.7)}50%{box-shadow:0 4px 0 var(--gold-edge),0 0 0 7px rgba(255,197,61,0)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

/* setup */
.sec{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:10px;box-shadow:var(--ledge)}
.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;line-height:1}
.prow .avb{width:52px;height:52px;font-size:28px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.prow input{flex:1;min-width:0;height:48px;border:2px solid var(--line);border-radius:14px;padding:0 12px;font-weight:800;font-size:16px;color:var(--ink);background:var(--paper)}
.prow input:focus{border-color:#f2760c;outline:none}
.prow .x{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--muted);display:grid;place-items:center;flex:none}
.add{align-self:flex-start;background:var(--paper);border:2px dashed #b9ccd8;border-radius:999px;padding:9px 14px;font-weight:900;font-size:14px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border-radius:20px;padding:12px;box-shadow:var(--ledge);border:3px solid var(--line)}
.opt.on{border-color:var(--before)}
.opt[aria-disabled="true"]{opacity:.55}
.opt .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none;background:var(--before-tint)}
.opt .tt{display:block;font:800 17px/1.15 var(--display);padding-top:2px}
.opt .ds{display:block;font-size:13px;font-weight:700;color:var(--muted);line-height:1.35;margin-top:2px}
.opt .ck{width:28px;height:28px;border-radius:50%;color:#fff;background:var(--before);display:grid;place-items:center;font-weight:900;flex:none}
.note{margin:0;background:var(--note-bg);border:2px solid var(--note-line);border-radius:18px;padding:12px 14px;font-size:14.5px;font-weight:800;line-height:1.45;color:var(--note-ink)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.how div{background:var(--paper);border-radius:18px;padding:14px;box-shadow:var(--ledge);display:flex;flex-direction:column;gap:6px}
.how .n{width:40px;height:40px;border-radius:50%;color:#fff;background:var(--before);display:grid;place-items:center;font:800 19px/1 var(--display);padding-top:3px}
.how b{font-size:16px;font-weight:900}
.how span:last-child{font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.4}
.linkbtn{align-self:center;display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px;color:var(--ink-3);padding:8px 12px;border-radius:999px}

/* the dock and the big button */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(207,230,239,0),var(--sky-2) 38%);display:flex;justify-content:center}
.cta{width:100%;max-width:440px;min-height:56px;background:var(--cta);color:#fff;font:800 21px/1 var(--display);padding:14px 24px 11px;border-radius:999px;box-shadow:0 6px 0 var(--cta-edge);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cta-edge)}
.cta.wait{background:var(--off);box-shadow:0 6px 0 var(--off-edge)}
.cta.small{font-size:18px;min-height:50px;padding:12px 18px 9px}
.cta.ghost{background:var(--paper);color:var(--ink-3);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}

/* the barangay and its homes */
.town{background:var(--paper);border-radius:20px;padding:10px 12px;box-shadow:var(--ledge);display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trow .who{font:800 15px/1.1 var(--display);padding-top:2px;min-width:0}
.trow .homes{display:flex;gap:4px;flex-wrap:wrap}
.trow .homes svg{width:30px;height:30px;display:block}
.trow .stars{margin-left:auto;font-weight:900;font-size:15px;white-space:nowrap}
.trow.agila .who{color:var(--agila)}.trow.kalabaw .who{color:var(--kalabaw)}

/* the board: the hazard against the Handa */
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch;background:var(--paper);border-radius:22px;padding:10px;box-shadow:var(--ledge-2)}
.side{border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.side.hz{background:var(--hz-tint)}
.side.hd{background:var(--ok-tint)}
.tag{font-size:10.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.side.hz .tag{color:var(--hz)}.side.hd .tag{color:var(--ok)}
.stack{position:relative;width:86px;height:84px}
.hc{position:absolute;top:2px;left:calc((28px - (var(--n) - 1) * 10px) / 2 + var(--i) * 10px);width:58px;height:78px;border-radius:12px;background:var(--hz);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.25);transform:rotate(calc(var(--i) * 6deg - 4deg));border:2px solid #fff}
.hc .n{font-size:9.5px;font-weight:900;letter-spacing:.6px}
.hzname{font:800 18px/1.05 var(--display);padding-top:2px}
.hzname small{display:block;font:700 12px/1.2 var(--body);color:var(--muted)}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;background:#e8c9c4}
.pips i.on{background:var(--hz-2)}
.lvname{font-size:12.5px;font-weight:900;line-height:1.25;color:var(--hz)}
.vs{display:grid;place-items:center}
.vs .w{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.5px}
.needline{margin-top:4px;background:var(--paper);border-radius:999px;padding:3px 11px 2px;font-size:12.5px;font-weight:900;color:var(--hz);white-space:nowrap}
.needline b{font:800 18px/1 var(--display)}
.big{font:800 40px/1 var(--display);padding-top:4px}
.needs{font-size:13px;font-weight:900;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.needs.ok{color:var(--ok)}
.meter{width:100%;height:10px;border-radius:999px;background:#d3e7dc;overflow:hidden;position:relative}
.piles{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.piles span{border-radius:12px;padding:6px 4px 5px;font-size:11px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center}
.piles b{font:800 20px/1 var(--display);padding-top:2px}
.piles .pb{background:var(--paper);color:var(--before)}.piles .pd{background:var(--paper);color:var(--during)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:999px}
.tline{width:100%;display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:12px;padding:6px 8px;text-align:left}
.tline .nm{font-weight:900;font-size:13px;flex:1;min-width:0}
.tline .v{font:800 17px/1 var(--display);padding-top:2px}
.tline .v small{font:800 11px/1 var(--body);color:var(--muted)}
.tline.agila .nm{color:var(--agila)}.tline.kalabaw .nm{color:var(--kalabaw)}
.ok-mark{color:var(--ok);font-weight:900}
.warn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:2px dashed #f0a49a;border-radius:999px;padding:6px 12px 6px 6px;font-weight:900;font-size:13.5px;color:var(--hz)}
.warn .ic{width:26px;height:26px;border-radius:50%;background:var(--hz);color:#fff;display:grid;place-items:center}

/* steps of a round */
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:900;color:var(--muted);background:var(--paper);border-radius:999px;padding:3px 9px 3px 5px}
.steps li i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.steps li.done i{background:var(--ok)}
.steps li.now{background:var(--ink);color:#fff}.steps li.now i{background:var(--gold)}

/* cards */
.zone{display:flex;flex-direction:column;gap:8px}
.zl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;min-height:146px;border-radius:16px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);overflow:hidden;text-align:left;color:var(--ink)}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.card .band{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 7px 4px;color:#fff;font-size:10.5px;font-weight:900;letter-spacing:.8px}
.card.ph-b .band{background:var(--before)}.card.ph-d .band{background:var(--during)}.card.ph-a .band{background:var(--after)}
.card.wild .band{background:var(--wild);color:var(--wild-ink)}
.card .band svg{flex:none}
.card .pic{font-size:27px;line-height:1;padding:7px 8px 2px}
.card .tx{flex:1;padding:2px 8px;font-size:13px;font-weight:800;line-height:1.25}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:4px 7px 7px;font-size:10.5px;font-weight:900;letter-spacing:.6px;color:var(--muted)}
.card .pw{background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.card.glow{border-color:var(--gold);box-shadow:0 4px 0 var(--gold-edge)}
.card.dim{opacity:.55;filter:saturate(.35)}
.card.mini{min-height:0}
.card.mini .tx{font-size:12.5px}
.empty{margin:0;font-size:14px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.6);border:2px dashed var(--line);border-radius:16px;padding:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn2{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:999px;padding:9px 14px;font-weight:900;font-size:14px;color:var(--ink-2)}
.btn2:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn2[aria-disabled="true"]{opacity:.5}
.done-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;color:var(--ok);background:var(--ok-tint);border-radius:999px;padding:5px 10px}

/* whose turn */
.who-head{display:flex;align-items:center;gap:10px}
.who-head .t{font:800 23px/1.05 var(--display);padding-top:3px}
.passcard{background:var(--paper);border-radius:28px;padding:26px 20px;box-shadow:var(--ledge-2);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.passcard .k{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.passcard .nm{font:800 40px/1 var(--display);padding-top:4px;word-break:break-word}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.order span.p{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border-radius:999px;padding:3px 10px 3px 4px;font-weight:900;font-size:13px;box-shadow:var(--ledge)}
.order span.p.now{outline:3px solid var(--gold)}

/* the storm update and the hit */
.reveal{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.rv{display:flex;flex-direction:column;align-items:center;gap:6px}
.rv .hc{position:relative;left:auto;top:auto;transform:none}
.tagx{font-size:11.5px;font-weight:900;border-radius:999px;padding:3px 9px}
.tagx.up{background:var(--hz-2);color:#fff}.tagx.next{background:var(--paper);color:var(--hz);border:2px dashed #f0a49a}.tagx.max,.tagx.back{background:var(--chip);color:var(--muted)}
.result{border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--ledge)}
.result.safe{background:var(--ok-tint);color:#0c5c3a}.result.hit{background:var(--bad-tint);color:#8a1f16}
.result .em{font-size:34px}
.result .bt{font:800 21px/1.1 var(--display);padding-top:2px}

/* the end of the season */
.badge{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:24px;padding:16px;box-shadow:var(--ledge-2)}
.badge .medal{width:72px;height:72px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:38px;flex:none;box-shadow:0 4px 0 var(--gold-edge)}
.badge .bt{font:800 24px/1.05 var(--display);padding-top:2px}
.badge p{margin:3px 0 0;color:var(--ink-3)}
.win{border-radius:24px;color:#fff;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.win.agila{background:linear-gradient(135deg,#3f8fb5,#1f5675)}.win.kalabaw{background:linear-gradient(135deg,#e06a0a,#a84d04)}.win.both{background:linear-gradient(135deg,#1e9c66,#0c5c3a)}
.win .em{font-size:44px}.win .bt{font:800 26px/1.05 var(--display);padding-top:3px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini3 div{background:var(--paper);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--ledge);font-size:12.5px;color:var(--muted)}
.mini3 b{display:block;font:800 22px/1 var(--display);color:var(--ink);padding-top:3px}
.helpers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.helper{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:10px;box-shadow:var(--ledge)}
.helper .bn{font:800 16px/1.1 var(--display);padding-top:2px}
.helper .why{font-size:12.5px;color:var(--muted)}
.learned{margin:0;padding:14px 14px 14px 32px;background:var(--paper);border-radius:18px;box-shadow:var(--ledge);display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 > *{flex:1 1 160px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--paper);border-radius:30px 30px 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .handle{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet h2{margin:0;font:800 23px/1.1 var(--display)}
.sheet h3{margin:6px 0 0;font-size:12.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:0;font-weight:700;line-height:1.5;color:var(--ink-2)}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-weight:700;line-height:1.45;color:var(--ink-2)}
.dark{background:var(--ink);color:#fff;font-weight:900;font-size:16px;padding:14px;border-radius:999px}
.ghost{background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:999px;padding:12px;font-weight:900;font-size:15px;color:var(--ink-3)}
.danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 #922a20;border-radius:999px;padding:12px;font-weight:900;font-size:15px}
.validation{align-self:center;background:var(--note-bg);border:2px solid var(--note-line);color:#7a5400;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:900;text-align:center}
.credits{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.credits .lab{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.credits .nm{font:800 19px/1.15 var(--display);padding-top:3px;color:var(--ink)}
.credits .po{font-size:14px;font-weight:700;color:var(--ink-3)}
.credits hr{width:100%;border:0;border-top:2px solid #eef2f4;margin:8px 0 2px}
.keyq{text-align:center;font:800 34px var(--display);background:var(--sky);border-radius:16px;padding:12px 0 6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:52px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font:800 22px var(--display);padding-top:3px;color:var(--ink)}
.keys button.ok{background:var(--before);color:#fff}
.bad-note{margin:0;color:var(--bad);font-weight:900;text-align:center}
.gto{display:flex;align-items:center;gap:10px;width:100%;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:18px;padding:10px;text-align:left}
.gto .nm{font:800 17px/1.1 var(--display);padding-top:2px;flex:1;min-width:0}
.gto .lb{font-size:12px;font-weight:900}
@media (max-width:380px){.hc{width:52px;height:70px;left:calc((26px - (var(--n) - 1) * 10px) / 2 + var(--i) * 10px)}.stack{width:78px;height:76px}.big{font-size:34px}.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
</style>

      '<path d="M31 30 q5 4 10 0" stroke="#2a2320" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';

  function house(ok) {

  }

  /* ===== State ===== */
  // setup: the players typed in (names stay in memory for this game only), the style and the level
  var S = { screen: 'setup', names: ['', ''], avs: [0, 1], style: 'together', level: 'easy', sound: true, voice: true, okHard: false, sheet: null, once: {} };
  var G = null, SAY = null, gateThen = null;
  var nameOf = function (i) { var n = (S.names[i] || '').trim(); return n || 'Player ' + (i + 1); };
  var avOf = function (p) { return AV[p.av] || AV[0]; };

  var teamOf = function (id) { for (var i = 0; i < E.TEAMS.length; i++) if (E.TEAMS[i].id === id) return E.TEAMS[i]; return null; };
  var teamChip = function (sid) { var t = teamOf(sid); return t ? '<span class="chip ' + t.id + '">' + t.icon + ' ' + t.short + '</span>' : ''; };
  var sideLabel = function (s) { return G.style === 'teams' ? s.name : 'The barangay'; };
  var PHC = { b: 'b', d: 'd', a: 'a' };

  /* ===== Bayani's voice (the device's own voices only) and sounds ===== */
  var TTS = (function () {
    var ok = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance === 'function';
    var voice = null, blocked = false, gen = 0;

      if (!ok) return;
      var vs = []; try { vs = window.speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
      var local = vs.filter(function (v) { return /^en/i.test(v.lang) && v.localService; });
      voice = local.find(function (v) { return /PH/i.test(v.lang); }) || local[0] || null;

    }
    if (ok) { choose(); try { window.speechSynthesis.addEventListener('voiceschanged', choose); } catch (e) { window.speechSynthesis.onvoiceschanged = choose; } }
    function spoken(t) { return String(t).replace(/[\uD83C-\uDBFF][\uDC00-\uDFFF]/g, '').replace(/No\. (\d)/g, 'Number $1').replace(/(\d) mm\b/g, '$1 millimeters').replace(/\+1/g, 'plus one'); }
    function stop() { gen++; if (EMBED) { post({ type: 'hush' }); return; } if (ok) { try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ } } }

      var my = ++gen;
      if (!S.sound || (!S.voice && !force)) return;

      if (!ok || blocked) return;

  function sfx(kind) {

  function bay(obj, quiet) { SAY = obj; if (obj && !quiet) TTS.say((obj.lead ? obj.lead + ' ' : '') + obj.text); }

  /* ===== Pieces ===== */
  function soundBtn() { return '<button class="sq" data-act="sound" data-k="sound" aria-pressed="' + S.sound + '" aria-label="' + (S.sound ? 'Sound is on' : 'Sound is off') + '">' + ico(S.sound ? I.speaker : I.mute, 20) + '</button>'; }

  }
  function stepsBar() {

  }

      '<div class="h2">' + esc(title) + '</div></div>' +

  }
  function town() {

        s.homes.map(house).join('') + '</span><span class="stars" aria-label="' + s.stars + ' stars">⭐ ' + s.stars + '</span></div>';

  function board() {
    var R = G.R, hz = HZ[R.hz], stack = '';

    var teams = G.style === 'teams', nd0 = E.need(G, G.sides[0]);
    var left = '<div class="side hz"><span class="tag">Hazard</span><div class="stack" aria-hidden="true">' + stack + '</div>' +

    },
    give: function () {
      var p = E.now(G), sh = S.sheet, R = G.R;
      if (!sh.card) {
        return '<div class="scrim" data-act="scrim"><div class="sheet up" role="dialog" aria-modal="true" aria-labelledby="gv"><span class="handle"></span><h2 id="gv">Give a card</h2>' +
          '<p>Pick a card to give. A friend who has nothing for ' + esc(HZ[R.hz].name) + ' can use it on their turn.</p><div class="grid">' +
          p.hand.map(function (c) { return cardHtml(c, 'gcard', { mini: true, kp: 'gcard-' }); }).join('') + '</div><button class="ghost" data-act="close" data-k="g-cancel">Cancel</button></div></div>';
      }
      var c = null;
      p.hand.forEach(function (x) { if (x.id === sh.card) c = x; });
      var others = G.players.filter(function (q) { return q.id !== p.id; });
      if (G.style === 'teams') others.sort(function (a, b) { return (a.side === p.side ? 0 : 1) - (b.side === p.side ? 0 : 1); });
      return '<div class="scrim" data-act="scrim"><div class="sheet up" role="dialog" aria-modal="true" aria-labelledby="gv"><span class="handle"></span><h2 id="gv">Give it to…</h2>' +
        (c ? '<div style="max-width:150px">' + cardHtml(c, null, { mini: true }) + '</div>' : '') +
        others.map(function (q) {
          var rival = G.style === 'teams' && q.side !== p.side;
          return '<button class="gto" data-act="gto" data-arg="' + q.id + '" data-k="gto-' + q.id + '">' + avatar(q, 44) + '<span class="nm">' + esc(q.name) + '</span>' +
            (G.style === 'teams' ? '<span class="lb" style="color:' + (rival ? 'var(--cta-edge)' : 'var(--ok)') + '">' + (rival ? 'Other team · +1 ⭐ for yours' : 'Your team') + '</span>' : '') + '</button>';
        }).join('') + '<button class="ghost" data-act="gback" data-k="g-back">Pick another card</button></div></div>';
    },
    quit: function () {
      return '<div class="scrim" data-act="scrim"><div class="sheet up" role="dialog" aria-modal="true" aria-labelledby="qh"><span class="handle"></span><h2 id="qh">End this game?</h2>' +
        '<p>The game stops here, and the names go back to the start screen.</p><div class="row2"><button class="ghost" data-act="close" data-k="q-keep">Keep playing</button><button class="danger" data-act="quitok" data-k="q-end">End game</button></div></div></div>';
    }
  };

  /* ===== Bayani's lines ===== */
  function arriveSay() {
    var R = G.R, nm = HZ[R.hz].name, first = E.player(G, R.order[0]);
    var w = G.queue.length ? ' Early warning: ' + HZ[G.queue[0]].name + ' may come after it.' : '';
    bay({ lead: 'Round ' + G.round + ': ' + nm + ' is coming!', text: 'Right now it is ' + E.lvName(G, R.hz, 1) + '.' + w + ' ' + first.name + ' goes first.' });
  }
  function turnSay() {
    var R = G.R, p = E.now(G), nm = HZ[R.hz].name, s = E.sideOf(G, p), hint = LV[G.level].hints ? ' The cards that glow fit.' : '';
    if (R.step === 'before') bay({ lead: p.name + ', get ready!', text: 'Take 1 supply card. Then play 1 Before card for ' + nm + ', or give a card to someone who needs it.' + hint });
    else if (R.step === 'during') {
      var nd = E.need(G, s), h = E.handa(G, s);
      bay({ lead: nm + ' is here!', text: (h >= nd ? sideLabel(s) + ' already matches it, but more never hurts.' : sideLabel(s) + ' has Handa ' + h + ' and needs ' + nd + '.') + ' Play 1 During card for ' + nm + ', or give one away.' + hint });
    } else {
      var dmg = s.homes.indexOf(false) >= 0;
      bay({ lead: 'Bounce back, ' + p.name + '!', text: (dmg ? 'Play 1 After card for ' + nm + ' to fix a home.' : 'No homes need fixing. An After card for ' + nm + ' earns a star.') + hint });
    }
  }
  function updateSay() {
    var R = G.R, nm = HZ[R.hz].name, ups = R.reveals.filter(function (r) { return r.kind === 'up'; }).length;
    var nexts = R.reveals.filter(function (r) { return r.kind === 'next'; }).map(function (r) { return HZ[r.hz].name; });
    var text = ups ? 'Another ' + nm + ' card came up' + (ups > 1 ? ', twice' : '') + '! It stacks, so ' + nm + ' is now ' + E.lvName(G, R.hz, R.level) + '.' : nm + ' stays at ' + E.lvName(G, R.hz, R.level) + '.';
    if (nexts.length) text += ' ' + nexts.join(' and ') + ' will come after this.';
    if (R.reveals.some(function (r) { return r.kind === 'max'; })) text += ' It cannot get any stronger in this game.';
    if (G.style === 'teams') text += ' ' + G.sides.map(function (s) { var m = E.need(G, s) - E.handa(G, s); return s.short + (m > 0 ? ' needs ' + m + ' more' : ' already matches it'); }).join(', and ') + '.';
    else { var s = G.sides[0], m = E.need(G, s) - E.handa(G, s); text += m > 0 ? ' The barangay needs ' + m + ' more. Play During cards next.' : ' Your Before cards already match it!'; }
    bay({ tone: ups ? 'bad' : '', lead: 'Storm update.', text: text });
  }
  function hitSay() {
    var R = G.R, nm = HZ[R.hz].name;
    if (G.style === 'teams') {
      bay({ tone: G.sides.every(function (s) { return R.hit[s.id].safe; }) ? 'good' : 'bad', lead: nm + ' hits!', text: G.sides.map(function (s) { var r = R.hit[s.id]; return s.short + (r.safe ? ' is safe and earns a star' : ' loses ' + r.damage + ' home' + (r.damage === 1 ? '' : 's')); }).join(', and ') + '. After cards for ' + nm + ' fix damaged homes.' });
      return;
    }
    var r = R.hit[G.sides[0].id];
    if (r.safe) bay({ tone: 'good', lead: 'Safe!', text: 'Your Handa of ' + r.handa + ' matched ' + nm + '. No homes were hurt, and the barangay earns a star. Now play After cards to bounce back.' });
    else bay({ tone: 'bad', lead: r.damage + ' home' + (r.damage === 1 ? ' was' : 's were') + ' damaged.', text: nm + ' needed Handa ' + r.need + ' and the barangay had ' + r.handa + '. After cards for ' + nm + ' can fix homes.' });
  }
  function endSay() {
    var res = E.result(G);
    if (G.style === 'teams') { var w = res.winner === 'both' ? null : E.side(G, res.winner); bay({ tone: 'good', lead: w ? w.name + ' wins!' : 'Both teams win!', text: 'That was the whole season. Matching your cards to each hazard, before, during and after, keeps a barangay safe.' }); return; }
    var s = res.sides[0];
    bay({ tone: res.badge === 'practice' ? '' : 'good', lead: s.safe === s.homes ? 'Every home is safe!' : s.safe + ' of ' + s.homes + ' homes are safe.', text: 'That was the whole season. Getting ready together, before, during and after, keeps a barangay safe.' });
  }

  /* ===== Actions ===== */
  function wrong(c, why) {
    var R = G.R, nm = HZ[R.hz].name, ph = E.STEP_PH[R.step];
    if (why === 'one card a turn') return { tone: 'nope', lead: 'One card a turn.', text: 'You already played a card. You can still give one away, then tap Done to pass the phone.' };
    if (!c.wild && c.hz !== R.hz) return { tone: 'nope', lead: 'Not this one.', text: 'That card is for ' + HZ[c.hz].name + ' (' + HZ[c.hz].en.toLowerCase() + '). Right now it is ' + nm + '. Keep it for later, or give it to someone.' };
    return { tone: 'nope', lead: 'Not yet.', text: 'That is a ' + E.PH[c.ph] + ' card. Right now it is time for ' + E.PH[ph] + ' cards for ' + nm + '.' };
  }
  function start() {
    var players = S.names.map(function (n, i) { return { name: nameOf(i), av: S.avs[i] }; });
    // the same name twice gets a number, so turns are never confusing
    var seen = {};
    players.forEach(function (p) { var k = p.name.toLowerCase(); if (seen[k]) p.name += ' ' + (++seen[k]); else seen[k] = 1; });
    G = E.create({ players: players, style: S.style, level: S.level, seed: Math.floor(Math.random() * 4294967295) + 1 });
    G.matchLog = [];
    S.screen = 'play'; S.sheet = null;
    arriveSay(); sfx('storm'); render();
  }
  function afterDone(r) {
    if (r.shared === 'update') { sfx('storm'); updateSay(); if (G.R.reveals.some(function (x) { return x.kind === 'up'; })) S.once.stack = true; }
    else if (r.shared === 'hit') { var R = G.R, all = G.sides.every(function (s) { return R.hit[s.id].safe; }); G.matchLog.push(all); sfx(all ? 'win' : 'bad'); hitSay(); }
    else if (r.shared === 'arrive') { sfx('storm'); arriveSay(); }
    else if (r.shared === 'end') { S.screen = 'end'; sfx('win'); endSay(); }
    else { sfx('pass'); SAY = null; TTS.stop(); }
  }
  var ACT = {
    noop: function () {},
    sound: function () { S.sound = !S.sound; TTS.stop(); render(); },
    about: function () { openSheet({ kind: 'about' }); },
    close: function () { closeSheet(); },
    scrim: function () { closeSheet(); },
    hear: function () { if (SAY) TTS.say((SAY.lead ? SAY.lead + ' ' : '') + SAY.text, true); },
    // setup
    av: function (i) { i = +i; var used = S.avs.filter(function (_, k) { return k !== i; }), n = S.avs[i]; do { n = (n + 1) % AV.length; } while (used.indexOf(n) >= 0); S.avs[i] = n; S.once.focus = 'av-' + i; render(); },
    add: function () { if (S.names.length >= 4) return; var free = 0; while (S.avs.indexOf(free) >= 0) free++; S.names.push(''); S.avs.push(free); if (S.names.length === 3 && S.style === 'teams') S.style = 'together'; render(); var el = $('#name-' + (S.names.length - 1)); if (el) el.focus(); },
    rm: function (i) { i = +i; if (S.names.length <= 2) return; S.names.splice(i, 1); S.avs.splice(i, 1); if (S.names.length === 3 && S.style === 'teams') S.style = 'together'; render(); },
    style: function (v) { if (v === 'teams' && S.names.length === 3) return; S.style = v === 'teams' ? 'teams' : 'together'; render(); },
    level: function (v) { S.level = v === 'hard' ? 'hard' : 'easy'; render(); },
    start: function () {
      if (S.level === 'hard' && !S.okHard) { gateThen = function () { S.okHard = true; start(); }; openSheet({ kind: 'gate', a: rnd(3, 9), b: rnd(6, 9), entry: '', wrong: false }); return; }
      start();
    },
    key: function (d) { var g = S.sheet; if (!g || g.kind !== 'gate' || g.entry.length >= 3) return; g.entry += String(d); g.wrong = false; render(); },
    bksp: function () { var g = S.sheet; if (!g || g.kind !== 'gate') return; g.entry = g.entry.slice(0, -1); render(); },
    ok: function () {
      var g = S.sheet;
      if (!g || g.kind !== 'gate') return;
      if (g.entry && Number(g.entry) === g.a * g.b) { var fn = gateThen; gateThen = null; S.sheet = null; sfx('good'); if (fn) fn(); else render(); }
      else { g.wrong = true; g.entry = ''; g.a = rnd(3, 9); g.b = rnd(6, 9); sfx('bad'); render(); }
    },
    easy: function () { S.sheet = null; gateThen = null; S.level = 'easy'; start(); },
    // the game
    go: function () {
      if (!E.proceed(G).ok) return;
      SAY = null; TTS.stop(); sfx('pass'); render();
    },
    reveal: function () { E.reveal(G); turnSay(); render(); },
    look: function () { bay({ tone: 'nope', text: 'First take 1 card from the supplies above.' }); render(); },
    take: function (id) {
      var R = G.R, r = E.take(G, id);
      if (!r.ok) return;
      var c = r.card, nm = HZ[R.hz].name, helps = c.wild || c.hz === R.hz;
      S.once.pop = c.id; sfx('pop');
      bay({ tone: helps ? 'good' : '', lead: c.wild ? 'A Bayanihan card!' : helps ? 'Good pick!' : 'Saved for later.', text: (c.wild ? 'It counts +1 for any hazard.' : helps ? 'That helps with ' + nm + '.' : 'That card is for ' + HZ[c.hz].name + '.') + ' Now play 1 ' + E.PH[E.STEP_PH[R.step]] + ' card, or give one away.' });
      render();
    },
    play: function (id) {
      var R = G.R, p = E.now(G), c = null;
      p.hand.forEach(function (x) { if (x.id === id) c = x; });
      if (!c) return;
      var r = E.play(G, id), nm = HZ[R.hz].name, s = E.sideOf(G, p);
      if (!r.ok) { S.once.shake = id; sfx('bad'); bay(wrong(c, r.why)); render(); return; }
      var what = c.wild ? 'Bayanihan: neighbors help each other.' : c.text + '.';
      if (r.ph === 'a') { sfx(r.fixed ? 'win' : 'good'); bay({ tone: 'good', lead: r.fixed ? 'A home is fixed!' : '+1 ⭐', text: what + (r.fixed ? ' Bouncing back is part of being ready.' : ' No homes needed fixing, so ' + (G.style === 'teams' ? s.name : 'the barangay') + ' earns a star.') }); }
      else {
        sfx('good');
        var nd = E.need(G, s), h = E.handa(G, s);
        bay({ tone: 'good', lead: '+1 ' + E.PH[r.ph] + '!', text: what + ' ' + (G.style === 'teams' ? s.short + '’s' : 'The barangay’s') + ' Handa is ' + h + (h >= nd ? ', and that matches ' + nm + ' for now.' : ' of the ' + nd + ' it needs.') });
      }
      render();
    },
    give: function () { var t = G.R.t, p = E.now(G); if (t.gave) { bay({ tone: 'nope', text: 'One gift a turn. You can give again on your next turn.' }); render(); return; } if (!p.hand.length) return; openSheet({ kind: 'give', card: null }); },
    gcard: function (id) { S.sheet.card = id; render(); },
    gback: function () { S.sheet.card = null; render(); },
    gto: function (to) {
      var r = E.give(G, S.sheet.card, to), q = E.player(G, to), p = E.now(G);
      S.sheet = null;
      if (!r.ok) { render(); return; }
      sfx('good');
      bay(r.rival ? { tone: 'good', lead: 'Bayanihan!', text: 'You gave ' + q.name + ' a card. Helping the other team earns ' + E.sideOf(G, p).name + ' a star.' } : { tone: 'good', lead: 'Bayanihan!', text: 'You gave ' + q.name + ' a card. They can play it on their turn.' });
      render();
    },
    done: function () {
      var r = E.done(G);
      if (!r.ok) { bay({ tone: 'nope', text: 'Take 1 supply card first. Tap one of the cards under Supplies.' }); render(); return; }
      afterDone(r); render();
    },
    quit: function () { openSheet({ kind: 'quit' }); },
    quitok: function () { TTS.stop(); S.sheet = null; G = null; SAY = null; S.screen = 'setup'; render(); },
    leave: function () { TTS.stop(); post({ type: 'exit' }); },
    again: function () { TTS.stop(); start(); },
    'new': function () { TTS.stop(); G = null; SAY = null; S.screen = 'setup'; render(); }
  };

  /* ===== Render ===== */
  var lastKey = null, sheetReturn = null, firstRender = true;
  function viewKey() { if (S.screen !== 'play') return S.screen; var R = G.R; return 'play-' + G.round + '-' + R.step + '-' + R.turn + '-' + (R.t && R.t.seen ? 1 : 0); }
  function render() {
    var app = $('#app'), key = viewKey(), same = key === lastKey, y = same ? window.scrollY : 0;
    var ae = document.activeElement, fk = ae && ae.getAttribute ? ae.getAttribute('data-k') : null;
    app.innerHTML = '<div class="wrap">' + SCREENS[S.screen]() + '</div>';
    $('#sheet').innerHTML = S.sheet ? SHEETS[S.sheet.kind]() : '';
    document.body.classList.toggle('locked', !!S.sheet);
    if (!same) { lastKey = key; try { window.scrollTo(0, 0); } catch (e) { /* jsdom */ } } else { try { window.scrollTo(0, y); } catch (e) { /* jsdom */ } }
    var target = S.once.focus ? document.querySelector('[data-k="' + S.once.focus + '"]') : fk && same ? document.querySelector('[data-k="' + fk + '"]') : null;
    if (S.sheet && (!target || !$('#sheet').contains(target))) target = $('#sheet .keys button') || $('#sheet button.card') || $('#sheet .gto') || $('#sheet .dark') || $('#sheet .ghost');
    if (!S.sheet && !same && !target && !firstRender) target = $('.dock .cta');
    firstRender = false;
    if (target) { try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); } }
    S.once = {};
  }
  function openSheet(sh) { var ae = document.activeElement; sheetReturn = ae && ae.getAttribute ? ae.getAttribute('data-k') : null; S.sheet = sh; render(); }
  function closeSheet() {
    S.sheet = null; gateThen = null; render();
    if (sheetReturn) { var el = document.querySelector('[data-k="' + sheetReturn + '"]'); if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } } }
  }

  /* ===== Events ===== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'scrim' && e.target !== t) return;
    if (t.getAttribute('aria-disabled') === 'true' && act !== 'give') return;
    var fn = ACT[act];
    if (fn) { e.preventDefault(); fn(t.getAttribute('data-arg')); }
  });
  document.addEventListener('input', function (e) {
    var i = e.target && e.target.getAttribute ? e.target.getAttribute('data-name') : null;
    if (i != null) S.names[+i] = e.target.value.slice(0, 12);
  });
  document.addEventListener('keydown', function (e) {
    if (S.sheet && e.key === 'Escape') { closeSheet(); return; }
    if (S.sheet && S.sheet.kind === 'gate') {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); ACT.key(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); ACT.bksp(); }
      else if (e.key === 'Enter' && e.target && e.target.tagName !== 'BUTTON') { e.preventDefault(); ACT.ok(); }
    }
    if (!S.sheet && e.key === 'Enter' && e.target && e.target.getAttribute && e.target.getAttribute('data-name') != null) { e.preventDefault(); e.target.blur(); }
  });
  window.addEventListener('pagehide', function () { TTS.stop(); });
  // For the tests: the state and the actions
  window.__group = { state: function () { return { S: S, G: G, SAY: SAY }; }, act: ACT, embed: EMBED };

  /* ===== Boot (keeps a game going if the page is updated while it is open) ===== */
  var hot = window.claude && window.claude.hot;
  function snapshot() { return JSON.parse(JSON.stringify({ S: { screen: S.screen, names: S.names, avs: S.avs, style: S.style, level: S.level, sound: S.sound, okHard: S.okHard }, G: G, SAY: SAY })); }
  var booted = false;
  function boot(data) {
    if (booted) return;
    booted = true;
    if (EMBED) {
      S.level = params.get('level') === 'hard' ? 'hard' : 'easy';
      S.sound = params.get('sound') !== '0';
      S.voice = params.get('voice') !== '0';
      S.okHard = true; // the library already asked for a grown-up when the player's age called for one
      var nick = (params.get('name') || '').trim().slice(0, 12);
      if (nick) S.names[0] = nick;
      render();
      return;
    }
    try {
      if (data && data.S) {
        ['names', 'avs', 'style', 'level', 'sound', 'okHard'].forEach(function (k) { if (data.S[k] != null) S[k] = data.S[k]; });
        if (data.G && data.S.screen !== 'setup') { G = data.G; SAY = data.SAY || null; S.screen = data.S.screen; }
      }
    } catch (e) { S.screen = 'setup'; G = null; }
    render();
  }
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(snapshot); } catch (e) { /* not in a viewer */ }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); } catch (e) { boot({}); } setTimeout(function () { boot({}); }, 1500); }
  else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
