<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handa vs. Hazard</title>
<meta name="description" content="A BAYANIHanda card game: hazards grow stronger as matching cards stack, and so do your Before, During and After responses.">
<!-- Handa vs. Hazard, a test game of the BAYANIHanda library. scripts/build-games.mjs copies this page into
     public/games/handa-vs-hazard.html with the fonts filled in below (and, with --standalone, into
     games/standalone/Handa-vs-Hazard.html with the fonts inside). -->
<!--@FONTS-->
<style>
/* page basics */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
:root{
  /* Layout: one phone-width column. The hazard's cards face your Handa cards across a VS meter, the barangay's
     six homes sit above them, and your hand of cards fills the bottom. One dark game-table look on purpose. */
  --navy:#13283a;--navy-0:rgba(19,40,58,0);--panel:#1d3b52;--panel-hi:#29506e;--frame:#0b1b28;--shadow:rgba(0,0,0,.35);--scrim:rgba(5,14,22,.72);
  --sun:#ffd24d;--sun-edge:#b38a00;--sun-ink:#2e2200;
  --cta:#d9650a;--cta-edge:#a34a05;
  --ink:#ffffff;--muted:#cfe0ea;--dim:#8fb2c6;
  --paper:#ffffff;--paper-2:#eef3f6;--paper-ink:#13283a;--paper-dim:#4f6577;--paper-line:#cfdae2;--card-edge:#9fb3c2;
  --before:#128253;--before-soft:#e5f6ee;--during:#b35205;--during-soft:#fff1e3;--after:#7a53c6;--after-soft:#f1ebfd;
  --haz:#5c2323;--haz-2:#2c1414;--haz-ink:#ffffff;--haz-line:#ff8a7a;
  --go:#1aa46a;--go-deep:#0f7a4b;--go-edge:#0c6a43;--nope:#ff9f43;--nope-ink:#9a4200;--warn:#ff9c94;
  --lv1:#ffe14a;--lv2:#ff9a3c;--lv3:#e8453b;
  --young-bg:#ffeca8;--young-fg:#6b4a00;--older-bg:#ffe0ee;--older-fg:#a3195b;
  --home:#ffffff;--roof:#f2760c;--home-hit:#6c7f8e;
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--navy);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:var(--sun);font-weight:900}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.app{max-width:560px;min-height:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;align-items:center;gap:10px}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--shadow)}
.ibtn.dark{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--frame)}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--frame)}
.h1{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-wrap:balance}
.h2{margin:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;text-wrap:balance}
.age{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:5px 9px;white-space:nowrap}
.age.young{background:var(--young-bg);color:var(--young-fg)}
.age.older{background:var(--older-bg);color:var(--older-fg)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}

/* round progress */
.round{display:flex;align-items:center;gap:10px}
.round b{flex:none;font-family:var(--display);font-size:16px;font-weight:800;color:var(--sun);line-height:1}
.steps{flex:1;min-width:0;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps li{display:flex;flex-direction:column;gap:3px;font-size:9.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);text-align:center}
.steps i{display:block;height:5px;border-radius:5px;background:var(--panel)}
.steps .done{color:var(--muted)}.steps .done i{background:var(--go)}
.steps .now{color:var(--sun)}.steps .now i{background:var(--sun)}

/* the barangay */
.town{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:8px 12px}
.town .lbl{flex:none;font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);line-height:1.15}
.homes{flex:1;min-width:0;display:flex;gap:4px;justify-content:center}
.homes svg{width:30px;height:30px;flex:none}
.stars{flex:none;font-weight:900;font-size:15px;color:var(--sun);white-space:nowrap}

/* the board: hazard vs Handa */
.board{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:8px;align-items:stretch}
.side{border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.side.hz{background:linear-gradient(160deg,var(--haz),var(--haz-2));box-shadow:0 4px 0 var(--frame)}
.side.hd{background:var(--panel);box-shadow:0 4px 0 var(--frame)}
.side .tag{font-size:10.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.side.hz .tag{color:var(--haz-line)}
.stack{position:relative;width:92px;height:100px;margin:2px 0 2px}
.hc{position:absolute;left:0;top:0;width:66px;height:88px;border-radius:10px;background:linear-gradient(160deg,#7a2d2d,#3a1717);border:2px solid var(--haz-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--haz-ink);box-shadow:0 3px 0 rgba(0,0,0,.4);transform:translate(calc(var(--i) * 11px),calc(var(--i) * 3px)) rotate(calc(var(--i) * 6deg - 6deg))}
/* a stack of matching hazard cards fans out, centered, so a stronger hazard looks bigger */
.stack .hc{left:calc((26px - (var(--n) - 1) * 11px) / 2);top:4px}
.hc .n{font-size:9px;font-weight:900;letter-spacing:.6px}
.lvname{font-weight:900;font-size:13px;line-height:1.2;color:var(--ink)}
.hzname{font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.hzname small{display:block;font-family:var(--body);font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18)}
.pips i.l1{background:var(--lv1)}.pips i.l2{background:var(--lv2)}.pips i.l3{background:var(--lv3)}
.vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.vs .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:800;line-height:1;padding-top:3px}
.vs .num.h{background:var(--lv3);color:var(--ink);box-shadow:0 3px 0 #8e2219}
.vs .num.r{background:var(--go-deep);color:var(--ink);box-shadow:0 3px 0 var(--go-edge)}
.vs .num.r.ok{background:var(--sun);color:var(--paper-ink);box-shadow:0 3px 0 var(--sun-edge)}
.vs span.w{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.piles{display:flex;gap:6px;width:100%;justify-content:center}
.pile{flex:1;min-width:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.pile b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.pile span{font-size:9.5px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.pile.b{background:var(--before-soft);color:var(--before)}
.pile.d{background:var(--during-soft);color:var(--during)}
.pile.a{background:var(--after-soft);color:var(--after)}
.meter{height:10px;border-radius:10px;background:var(--frame);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:var(--go)}
.meter i.ok{background:var(--sun)}
.meter u{position:absolute;top:0;bottom:0;width:3px;background:var(--lv3);text-decoration:none}
.warnchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--frame);border:2px dashed var(--haz-line);color:var(--ink);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:900}
.warnchip span.ic{width:26px;height:26px;border-radius:50%;background:var(--haz);display:grid;place-items:center}

/* Bayani says */
.say{display:flex;gap:8px;align-items:flex-end}
.say-face{width:50px;flex:none}
.say-face svg{display:block;width:100%;height:auto}
.say-text{flex:1;min-width:0;margin:0;background:var(--paper);color:var(--paper-ink);border-radius:18px 18px 18px 4px;padding:10px 13px;font-size:14.5px;font-weight:800;line-height:1.42;border:3px solid var(--paper)}
.say-text b{font-weight:900}
.say.good .say-text{border-color:var(--go)}.say.good .say-text b{color:var(--go-deep)}
.say.nope .say-text{border-color:var(--nope)}.say.nope .say-text b{color:var(--nope-ink)}
.say.bad .say-text{border-color:var(--lv3)}.say.bad .say-text b{color:#a3241b}
.say-hear{width:42px;height:42px;flex:none;align-self:center;border-radius:12px;border:0;background:var(--panel);color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--frame)}

/* cards */
.zone{display:flex;flex-direction:column;gap:8px}
.zone .zl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.card{position:relative;width:100%;min-height:150px;border-radius:14px;border:0;background:var(--paper);color:var(--paper-ink);padding:0 0 22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 0 var(--card-edge);text-align:left}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--card-edge)}
.card .band{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:5px 6px 5px 8px;color:var(--ink);font-size:10.5px;font-weight:900;letter-spacing:.8px}
.card.ph-b .band{background:var(--before)}.card.ph-d .band{background:var(--during)}.card.ph-a .band{background:var(--after)}
.card.ph-b{background:linear-gradient(var(--paper) 60%,var(--before-soft))}
.card.ph-d{background:linear-gradient(var(--paper) 60%,var(--during-soft))}
.card.ph-a{background:linear-gradient(var(--paper) 60%,var(--after-soft))}
.card .hzb{width:22px;height:22px;flex:none;border-radius:50%;background:var(--paper);color:var(--haz);display:grid;place-items:center}
.card .pic{font-size:30px;line-height:1;text-align:center;padding:8px 0 4px}
.card .tx{padding:0 8px;font-size:12.5px;font-weight:900;line-height:1.22}
.card .hzn{position:absolute;left:8px;bottom:6px;font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--paper-dim)}
.card .pw{position:absolute;right:6px;bottom:5px;font-family:var(--display);font-weight:800;font-size:14px;line-height:1;border-radius:999px;padding:3px 6px 1px;background:var(--paper-ink);color:var(--sun)}
.card.wild{background:linear-gradient(160deg,#fff7d1,#ffe2a8)}
.card.wild .band{background:linear-gradient(90deg,#1aa46a,#d9650a,#7a53c6)}
.card.glow{box-shadow:0 0 0 3px var(--sun),0 4px 0 var(--sun-edge)}
.card.dim{opacity:.5}
.card.picked{outline:3px solid var(--go);outline-offset:2px}
.reveal{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rv{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:900;text-align:center;max-width:120px}
.rv .hc{position:relative;transform:none}
.rv .tagx{border-radius:999px;padding:3px 9px}
.rv .tagx.up{background:var(--lv3);color:var(--ink)}
.rv .tagx.next{background:var(--panel-hi);color:var(--ink)}
.rv .tagx.max{background:var(--frame);color:var(--muted)}
.banner{border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-weight:800;line-height:1.35}
.banner.safe{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-edge)}
.banner.hit{background:#ffd9d4;color:#5a1610;box-shadow:0 4px 0 #c97066}
.banner .big{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.05}
.banner .em{font-size:34px;flex:none}

/* dock and buttons */
.dock{position:sticky;bottom:0;z-index:5;margin-top:auto;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--navy-0),var(--navy) 38%)}
.dock:empty{padding:0}
.cta{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:999px;border:0;background:var(--cta);color:var(--ink);font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;box-shadow:0 6px 0 var(--cta-edge);padding:8px 20px;text-align:center}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cta-edge)}
.cta.ghost{background:var(--panel);box-shadow:0 5px 0 var(--frame)}
.cta.wait{background:var(--panel);color:var(--muted);box-shadow:0 5px 0 var(--frame);cursor:default}
.cta.small{min-height:52px;font-size:18px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.linkbtn{background:transparent;border:0;color:var(--muted);font-weight:900;font-size:14px;min-height:44px;padding:0 6px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:3px}
.center{display:flex;justify-content:center}

/* title and end */
.hero{border-radius:22px;background:radial-gradient(120% 90% at 30% 20%,#2b5577,#13283a 70%);border:6px solid var(--frame);padding:16px;display:flex;align-items:center;gap:12px;overflow:hidden}
.hero .fan{position:relative;width:196px;height:150px;flex:none}
.hero .fan .f{position:absolute}
.hero .fan .hzf{left:0;top:22px;width:76px;height:100px}
.hero .fan .c1,.hero .fan .c2{width:104px;transform-origin:top left}
.hero .fan .c1{left:56px;top:6px;transform:scale(.72) rotate(3deg)}
.hero .fan .c2{left:116px;top:20px;transform:scale(.72) rotate(12deg)}
.hero .mas{width:78px;flex:none;margin-left:auto}
.title-h{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:15.5px;font-weight:700;line-height:1.45}
.how{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.how li{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:16px;padding:10px 12px;font-size:14px;font-weight:800;line-height:1.4;color:var(--muted)}
.how li b{color:var(--ink)}
.how .n{width:28px;height:28px;flex:none;border-radius:50%;background:var(--sun);color:var(--paper-ink);display:grid;place-items:center;font-family:var(--display);font-size:16px;font-weight:800;padding-top:2px}
.levels{display:grid;gap:10px}
.level{position:relative;border-radius:20px;border:3px solid var(--panel);background:var(--panel);padding:12px 14px 12px 46px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--frame)}
.level::before{content:"";position:absolute;left:14px;top:15px;width:20px;height:20px;border-radius:50%;border:3px solid var(--dim)}
.level.on{border-color:var(--sun);background:var(--panel-hi)}
.level.on::before{border-color:var(--sun);background:radial-gradient(circle,var(--sun) 45%,transparent 50%)}
.lv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv-top b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1}
.lv-txt{font-size:14px;font-weight:700;color:var(--muted);line-height:1.4}
.lv-note{font-size:12.5px;font-weight:800;color:var(--sun)}
.result{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.result .row{display:flex;align-items:center;gap:12px}
.badge{background:var(--sun);color:var(--sun-ink);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 var(--sun-edge)}
.badge .medal{width:58px;height:58px;flex:none;border-radius:50%;background:var(--paper-ink);color:var(--sun);display:grid;place-items:center;border:4px solid var(--paper);font-size:28px}
.badge b{display:block;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05}
.badge p{margin:2px 0 0;font-size:13px;font-weight:800;line-height:1.35}
.learned{margin:0;padding-left:20px;display:grid;gap:5px;font-weight:800;font-size:14px;line-height:1.4;color:var(--muted)}
.learned b{color:var(--ink)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:24px 24px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.sh-h{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.sh-h3{margin:6px 0 0;font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--paper-dim)}
.sh-p{margin:0;font-size:14.5px;font-weight:700;line-height:1.5}
.sh-list{margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px;font-weight:700;line-height:1.45}
.sh-list a{color:var(--cta-edge)}
.sel{user-select:all;-webkit-user-select:all;font-weight:900}
.credits{margin:0;display:grid;gap:4px}
.credits dt{margin-top:6px;font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--paper-dim)}
.credits dd{margin:0;font-size:14.5px;font-weight:700;line-height:1.35}
.credits dd b{font-weight:900}
.sh-btn{min-height:52px;border-radius:999px;border:0;background:var(--cta);color:var(--ink);font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--cta-edge)}
.sh-btn.ghost{background:var(--paper-2);color:var(--paper-ink);box-shadow:0 4px 0 var(--paper-line)}
.gate{display:flex;flex-direction:column;gap:8px;background:var(--paper-2);border-radius:18px;padding:12px}
.kq{font-size:13px;font-weight:900;color:var(--paper-dim);text-align:center}
.kq.big{font-family:var(--display);font-size:28px;font-weight:800;color:var(--paper-ink)}
.kdisp{height:52px;border-radius:14px;background:var(--navy);color:var(--sun);display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums}
.kbad{margin:0;text-align:center;font-weight:900;color:var(--nope-ink);font-size:14px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:54px;border-radius:14px;border:0;background:var(--paper);color:var(--paper-ink);font-family:var(--display);font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--paper-line)}
.key.ok{background:var(--go-deep);color:var(--ink);box-shadow:0 3px 0 var(--go-edge)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{border-radius:12px;padding:8px;font-size:12.5px;font-weight:800;line-height:1.3}

/* one-shot effects */
.shake{animation:shake .42s ease-in-out}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.flip{animation:flip .5s ease-out}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@media (max-width:370px){.board{grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr)}.vs .num{width:44px;height:44px;font-size:24px}.homes svg{width:24px;height:24px}}
@media (min-width:600px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>

  var HZI = {

    flood: '<path d="M6 11V7l6-4 6 4v4"/><path d="M2 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 20c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/>',
    quake: '<path d="M2 12h4l2-5 3 10 3-12 2 7h6"/><path d="M3 20h18"/>',

    surge: '<path d="M2 19c3 0 4-2 6-2s3 2 6 2 4-2 8-2"/><path d="M5 14c0-5 4-9 9-9 3 0 5 2 5 4-2-1-4 0-4 2 0 3 4 3 6 1"/>'

  function mascot(o) {
    o = o || {};
    var arm = o.point ? '<rect x="49" y="22" width="7" height="20" rx="3.5" fill="#e8ab70" transform="rotate(-55 51 40)"/>' : '<rect x="47" y="39" width="7" height="18" rx="3.5" fill="#e8ab70"/>';

    return '<svg viewBox="0 0 72 80" aria-hidden="true">' +
      '<path d="M24 36 L48 36 L52 70 L20 70 Z" fill="#f2760c" opacity="0.92"/><rect x="24" y="37" width="24" height="26" rx="8" fill="#1f6f8b"/>' +
      '<polygon points="36,41 38.2,46 43.6,46.4 39.4,49.9 40.8,55.2 36,52.2 31.2,55.2 32.6,49.9 28.4,46.4 33.8,46" fill="#ffd24d"/>' +
      '<rect x="18" y="39" width="7" height="18" rx="3.5" fill="#e8ab70"/>' + arm +
      '<rect x="28" y="61" width="7" height="14" rx="3" fill="#35506b"/><rect x="37" y="61" width="7" height="14" rx="3" fill="#35506b"/>' +
      '<circle cx="36" cy="24" r="13" fill="#e8ab70"/><path d="M23 23 a13 13 0 0 1 26 0 v-3 a13 13 0 0 0 -26 0 Z" fill="#3a2a22"/>' +
      '<path d="M21 18 a15 10 0 0 1 30 0 Z" fill="#ffc53d"/><rect x="19" y="16" width="34" height="4.5" rx="2.25" fill="#eaa100"/>' +
      '<circle cx="31" cy="25" r="1.9" fill="#2a2320"/><circle cx="41" cy="25" r="1.9" fill="#2a2320"/>' + mouth + '</svg>';
  }

  /* ===== The cards =====
     Hazards (Filipino name first). levels: what each intensity is called. Easy uses plain words; Difficult uses the real
     scales where there is one: PAGASA's wind signals, PAGASA's rainfall warnings, and the PHIVOLCS Earthquake
     Intensity Scale. Responses: three actions per hazard for Before, During and After. */
  var HZ = {
    typhoon: { name: 'Bagyo', en: 'Typhoon', easy: ['Strong winds', 'Very strong winds', 'Even stronger winds'], hard: ['Signal No. 1', 'Signal No. 2', 'Signal No. 3'] },
    flood: { name: 'Baha', en: 'Flood', easy: ['Yellow rain warning', 'Orange rain warning', 'Red rain warning'], hard: ['Yellow warning: 7.5 to 15 mm of rain an hour', 'Orange warning: 15 to 30 mm an hour', 'Red warning: over 30 mm an hour'] },
    quake: { name: 'Lindol', en: 'Earthquake', easy: ['Strong shaking', 'Very strong shaking', 'Destructive shaking'], hard: ['Intensity V: Strong', 'Intensity VI: Very Strong', 'Intensity VII: Destructive'] },
    fire: { name: 'Sunog', en: 'Fire', easy: ['Small fire', 'Spreading fire', 'Big fire'], hard: ['Small fire', 'Spreading fire', 'Big fire'] },
    slide: { name: 'Guho', en: 'Landslide', easy: ['Cracks on the slope', 'Rocks falling', 'Big landslide'], hard: ['Cracks on the slope', 'Rocks falling', 'Big landslide'] },
    surge: { name: 'Daluyong', en: 'Storm surge', easy: ['High waves', 'Water at the shore', 'Big storm surge'], hard: ['High waves', 'Water at the shore', 'Big storm surge'] }
  };
  var ACTIONS = {
    typhoon: {
      b: [['Bring loose things inside', '📥'], ['Charge the radio and power bank', '🔋'], ['Listen to PAGASA updates', '📻']],
      d: [['Stay inside, away from windows', '🏠'], ['Go to the evacuation center when told', '🏫'], ['Keep your go bag close', '🎒']],
      a: [['Stay away from fallen wires', '⚡'], ['Wait for the all-clear before going out', '✅'], ['Help clean up with a grown-up', '🧹']]
    },
    flood: {
      b: [['Move important things up high', '📦'], ['Put papers in a plastic pouch', '📄'], ['Know your evacuation route', '🗺️']],
      d: [['Go to higher ground early', '⛰️'], ['Never walk or play in floodwater', '🚫'], ['Stay away from rivers and canals', '🚷']],
      a: [['Wash hands with clean water', '💧'], ['Throw away food that touched floodwater', '🗑️'], ['Get scratches checked', '🏥']]
    },
    quake: {
      b: [['Tie tall cabinets to the wall', '🗄️'], ['Know the safe spots in each room', '🔍'], ['Join the earthquake drill', '🔔']],
      d: [['Duck, cover and hold', '🙇'], ['Stay away from windows and shelves', '📚'], ['Outside? Move to an open space', '🏞️']],
      a: [['Walk out calmly when the shaking stops', '🚶'], ['Stay in the open during aftershocks', '⚠️'], ['Check for injuries and tell a grown-up', '🗣️']]
    },
    fire: {
      b: [['Don’t overload outlets', '🔌'], ['Test the smoke alarm', '🚨'], ['Plan two ways out', '🚪']],
      d: [['Get down low under the smoke', '⬇️'], ['Get out and stay out', '🏃'], ['Call 911 or shout for help', '📞']],
      a: [['Never go back inside', '⛔'], ['Meet at your meeting place', '📍'], ['Talk about how you feel', '💬']]
    },
    slide: {
      b: [['Watch for cracks on slopes', '👀'], ['Plant trees and grass on slopes', '🌱'], ['Learn the warning signs', '📋']],
      d: [['Move away from the slope’s path', '🏃'], ['Listen for rumbling sounds', '👂'], ['Go to the evacuation center early', '🏫']],
      a: [['Stay away from the slide area', '⛔'], ['Report broken roads and pipes', '📞'], ['Wait for the all-clear', '✅']]
    },
    surge: {
      b: [['Know if your home is near the shore', '🗺️'], ['Leave the coast early when warned', '🚗'], ['Pack the go bag', '🎒']],
      d: [['Stay at the evacuation center inland', '🏫'], ['Stay far from the shore', '🚫'], ['Listen to PAGASA warnings', '📻']],
      a: [['Wait for the all-clear before going home', '✅'], ['Watch out for debris', '⚠️'], ['Help your neighbors', '🤝']]
    }
  };
  var PH = {
    b: { word: 'BEFORE', name: 'Before', doing: 'get ready', step: 'before' },
    d: { word: 'DURING', name: 'During', doing: 'stay safe while it happens', step: 'during' },
    a: { word: 'AFTER', name: 'After', doing: 'bounce back', step: 'after' }
  };
  var STEP_PH = { before: 'b', during: 'd', after: 'a' };
  var STEPS = [['supply', 'Supplies'], ['before', 'Before'], ['update', 'Update'], ['during', 'During'], ['after', 'After']];
  // Easy: four hazards, one storm update a round, glowing hints. Difficult: six hazards, two updates, no hints.
  // grow: the chance that a storm update brings another card of the same hazard, so hazards often build up.
  var LV = {
    easy: { hz: ['typhoon', 'flood', 'quake', 'fire'], rounds: 5, updates: 1, grow: 0.35, hints: true, wild: 0.12, label: 'Ages 6 to 10', age: 'young' },
    hard: { hz: ['typhoon', 'flood', 'quake', 'fire', 'slide', 'surge'], rounds: 6, updates: 2, grow: 0.4, hints: false, wild: 0.08, label: 'Ages 10 to 15', age: 'older' }
  };
  var HOMES = 6, HAND_MAX = 8;

  /* ===== State ===== */
  // sound: every sound; voice: Bayani reads his lines aloud by himself (the speaker button always reads, sound on)
  var S = { screen: 'title', level: 'easy', sound: true, voice: true, sheet: null, okHard: false, once: {} };
  var G = null, uid = 0;
  function card(hz, ph, i) { var a = ACTIONS[hz][ph][i]; return { id: 'c' + (++uid), hz: hz, ph: ph, text: a[0], pic: a[1] }; }
  function anyCard(hz, ph) { return card(hz, ph, rnd(0, ACTIONS[hz][ph].length - 1)); }
  function wild() { return { id: 'c' + (++uid), wild: true, text: 'Neighbors help each other. +1 for any hazard, any time.', pic: '🤝' }; }
  function randCard() { var L = LV[S.level]; return Math.random() < L.wild ? wild() : anyCard(pick(L.hz), pick(['b', 'd', 'a'])); }
  function lvName(hz, n) { return HZ[hz][S.level][Math.max(1, Math.min(3, n)) - 1]; }
  function hazardDeck() { var d = []; LV[S.level].hz.forEach(function (h) { for (var i = 0; i < 4; i++) d.push(h); }); return shuffle(d); }
  function fromDeck() { if (!G.deck.length) G.deck = hazardDeck(); return G.deck.shift(); }

  function newGame() {
    G = { round: 0, rounds: LV[S.level].rounds, deck: hazardDeck(), queue: [], homes: [], stars: 0, hand: [], R: null, say: null, safe: 0, faced: [], wrong: 0, full: 0, dropped: 0 };
    for (var h = 0; h < HOMES; h++) G.homes.push(true);

  // A round: a hazard arrives at intensity 1 (from the early warning queue first). Supplies, Before cards, a storm
  // update that may stack the hazard higher, During cards, the hazard hits, then After cards.
  function nextRound() {
    G.round++;
    if (G.round > G.rounds) { endGame(); return; }
    var hz = G.queue.length ? G.queue.shift() : fromDeck();
    G.R = { hz: hz, level: 1, step: 'supply', prep: 0, act: 0, fixed: 0, help: 0, played: { b: [], d: [], a: [] }, supply: makeSupply(hz), picked: 0, reveals: [], damage: 0, result: null };
    if (G.faced.indexOf(hz) < 0) G.faced.push(hz);
    var nm = HZ[hz].name, warn = G.queue.length ? ' Early warning: ' + HZ[G.queue[0]].name + ' may come next.' : '';
    gsay({ lead: nm + ' is coming!', text: 'Right now it is ' + lvName(hz, 1) + '. Pick 2 supply cards that help with ' + nm + '.' + warn });
  }
  // Four supply cards to pick 2 from. Easy always has a Before and a During card for the coming hazard; Difficult has
  // one card for it. There is often one for the next hazard in the early warning.
  function makeSupply(hz) {
    var s = [];
    if (S.level === 'easy') { s.push(anyCard(hz, 'b')); s.push(anyCard(hz, 'd')); }
    else s.push(anyCard(hz, pick(['b', 'd'])));
    if (G.queue.length) s.push(anyCard(G.queue[0], pick(['b', 'd', 'a'])));
    while (s.length < 4) s.push(randCard());
    return shuffle(s);
  }
  function stormUpdate() {
    var R = G.R, n = LV[S.level].updates, out = [];
    for (var i = 0; i < n; i++) {
      var hz = Math.random() < LV[S.level].grow ? R.hz : fromDeck();
      if (hz === R.hz && R.level < 3) { R.level++; out.push({ hz: hz, kind: 'up' }); }
      else if (hz === R.hz) { out.push({ hz: hz, kind: 'max' }); }
      else if (G.queue.length < 2) { G.queue.push(hz); out.push({ hz: hz, kind: 'next' }); }
      else { G.deck.push(hz); out.push({ hz: hz, kind: 'back' }); }
    }
    R.reveals = out;
    var nm = HZ[R.hz].name, ups = out.filter(function (r) { return r.kind === 'up'; }).length;
    var nexts = out.filter(function (r) { return r.kind === 'next'; }).map(function (r) { return HZ[r.hz].name; });
    var text = ups ? 'Another ' + nm + ' card came up' + (ups > 1 ? ', twice' : '') + '! It stacks, so ' + nm + ' is now ' + lvName(R.hz, R.level) + '.'
      : nm + ' stays at ' + lvName(R.hz, R.level) + '.';
    if (nexts.length) text += ' ' + nexts.join(' and ') + ' will come after this.';
    if (out.some(function (r) { return r.kind === 'max'; })) text += ' It cannot get any stronger in this game.';
    var need = R.level - R.prep;
    text += need > 0 ? ' You need ' + need + ' more to match it. Play During cards next.' : ' Your Before cards already match it!';
    gsay({ tone: ups ? 'bad' : 'info', lead: 'Storm update.', text: text });
  }
  function hit() {
    var R = G.R, total = R.prep + R.act, nm = HZ[R.hz].name;
    if (total >= R.level) {
      R.result = 'safe'; G.safe++; G.stars++;
      sfx('win');
      gsay({ tone: 'good', lead: 'Safe!', text: 'Your Handa of ' + total + ' matched ' + nm + ' at ' + R.level + '. No homes were hurt. Now play After cards to help the barangay bounce back.' });
    } else {
      var dmg = R.level - total, done = 0;
      for (var i = 0; i < G.homes.length && done < dmg; i++) { if (G.homes[i]) { G.homes[i] = false; done++; } }
      R.damage = done; R.result = 'hit';
      sfx('bad');
      gsay({ tone: 'bad', lead: done + ' home' + (done === 1 ? ' was' : 's were') + ' damaged.', text: nm + ' was ' + R.level + ' and your Handa was ' + total + '. Play After cards for ' + nm + ' to fix homes.' });
    }
    R.step = 'after';
  }
  function endRound() {
    var R = G.R, drop = Math.max(0, G.hand.length - HAND_MAX);
    // a hand holds up to 8 cards; the oldest go back if there are more
    if (drop) { G.dropped += drop; G.hand.splice(0, drop); }
    R.step = 'done';
    nextRound();
    if (drop && G.say && S.screen === 'play') G.say.text += ' Your hand was full, so ' + (drop === 1 ? 'your oldest card' : 'your ' + drop + ' oldest cards') + ' went back to the deck.';
  }
  function endGame() {
    S.screen = 'end';
    var safe = G.homes.filter(Boolean).length;
    gsay({ tone: safe === HOMES ? 'good' : 'info', lead: safe === HOMES ? 'Every home is safe!' : safe + ' of ' + HOMES + ' homes are safe.', text: 'That was the whole season. Matching your cards to each hazard, before, during and after, is what keeps a barangay safe.' });
  }

  /* ===== Bayani's voice (the device's own voices only) and sounds ===== */
  var TTS = (function () {
    var ok = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance === 'function';
    var voice = null, blocked = false, gen = 0;
    function choose() {
      if (!ok) return;
      var vs = []; try { vs = window.speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
      var local = vs.filter(function (v) { return /^en/i.test(v.lang) && v.localService; });
      voice = local.find(function (v) { return /PH/i.test(v.lang); }) || local[0] || null;
      blocked = vs.length > 0 && !voice;
    }
    if (ok) { choose(); try { window.speechSynthesis.addEventListener('voiceschanged', choose); } catch (e) { window.speechSynthesis.onvoiceschanged = choose; } }
    function spoken(t) { return String(t).replace(/[\uD83C-\uDBFF][\uDC00-\uDFFF]/g, '').replace(/No\. (\d)/g, 'Number $1').replace(/(\d) mm\b/g, '$1 millimeters').replace(/\+1/g, 'plus one'); }
    function stop() { gen++; if (EMBED) { post({ type: 'hush' }); return; } if (ok) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } } }
    function say(text, force) {
      var my = ++gen;
      if (!S.sound || (!S.voice && !force)) return;
      if (EMBED) { post({ type: 'say', text: spoken(text), force: !!force }); return; } // the library speaks (see above)
      if (!ok || blocked) return;
      var u = new window.SpeechSynthesisUtterance(spoken(text));
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = 0.95; u.pitch = 1.08;
      var go = function () { if (my === gen) { try { window.speechSynthesis.speak(u); } catch (e) { /* ignore */ } } };
      try { if (window.speechSynthesis.speaking || window.speechSynthesis.pending) { window.speechSynthesis.cancel(); setTimeout(go, 90); } else go(); } catch (e) { /* ignore */ }
    }
    return { say: say, stop: stop };
  })();
  var AC = null;
  function sfx(kind) {
    if (!S.sound) return;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = AC || new C();
      if (AC.state === 'suspended') AC.resume();
      var seq = { good: [[660, 0], [880, 0.11]], bad: [[240, 0], [190, 0.12]], pop: [[520, 0], [780, 0.06]], win: [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36]], storm: [[180, 0], [150, 0.14], [120, 0.28]] }[kind] || [];
      var now = AC.currentTime;
      seq.forEach(function (n) {
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = 'triangle'; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, now + n[1]); g.gain.exponentialRampToValueAtTime(0.15, now + n[1] + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + n[1] + 0.24);
        o.connect(g); g.connect(AC.destination); o.start(now + n[1]); o.stop(now + n[1] + 0.26);
      });
    } catch (e) { /* sound is optional */ }
  }
  function gsay(obj) { G.say = obj; TTS.say((obj.lead ? obj.lead + ' ' : '') + obj.text); }

  /* ===== Pieces ===== */
  function backBtn() { return '<button class="ibtn" data-act="quit" data-k="back" aria-label="' + (EMBED ? 'Back to the library' : 'Back to the start') + '">' + ico(P.back, 20, 2.6) + '</button>'; }
  function soundBtn() { return '<button class="ibtn dark" data-act="sound" data-k="sound" aria-pressed="' + S.sound + '" aria-label="' + (S.sound ? 'Sound is on' : 'Sound is off') + '">' + ico(S.sound ? P.speaker : P.mute, 20) + '</button>'; }
  function ageChip() { var L = LV[S.level]; return '<span class="age ' + L.age + '">' + L.label + '</span>'; }
  function bubble(s) {
    if (!s) return '';
    return '<div class="say ' + (s.tone || 'info') + '" role="status" aria-live="polite"><div class="say-face">' + mascot({ smile: s.tone !== 'nope' && s.tone !== 'bad' }) + '</div>' +
      '<p class="say-text">' + (s.lead ? '<b>' + esc(s.lead) + '</b> ' : '') + esc(s.text) + '</p>' +
      '<button class="say-hear" data-act="hear" data-k="hear" aria-label="Hear Bayani again">' + ico(P.speaker, 18) + '</button></div>';
  }
  function house(ok) {
    return '<svg viewBox="0 0 30 30" role="img" aria-label="' + (ok ? 'Safe home' : 'Damaged home') + '">' +
      (ok ? '<path d="M4 14 L15 5 L26 14 Z" fill="var(--roof)"/><rect x="7" y="13" width="16" height="12" rx="1.5" fill="var(--home)"/><rect x="13" y="17" width="4" height="8" fill="var(--panel)"/>'
        : '<path d="M4 15 L14 7 L24 12 Z" fill="var(--home-hit)"/><rect x="7" y="14" width="16" height="11" rx="1.5" fill="var(--home-hit)"/><path d="M12 14 l3 4 -2 3 3 4" stroke="var(--frame)" stroke-width="1.6" fill="none"/>') + '</svg>';
  }

        R.act++; sfx('good');
        var tot = R.prep + R.act;
        gsay({ tone: 'good', lead: '+1 During!', text: (c.wild ? 'Bayanihan: neighbors help each other.' : c.text + '.') + (tot >= R.level ? ' Your Handa now matches ' + nm + '. Tap Face it when you are ready.' : ' ' + (R.level - tot) + ' more to match ' + nm + '.') });
      } else {
        var k = G.homes.indexOf(false);
        if (k >= 0) { G.homes[k] = true; R.fixed++; sfx('win'); gsay({ tone: 'good', lead: 'A home is fixed!', text: (c.wild ? 'Neighbors helped rebuild.' : c.text + '.') + ' Bouncing back is part of being ready.' }); }
        else { G.stars++; R.help++; sfx('good'); gsay({ tone: 'good', lead: '+1 ⭐', text: (c.wild ? 'Neighbors helped each other.' : c.text + '.') + ' No homes need fixing, so you helped the barangay bounce back stronger.' }); }
      }
      render();
    },
    ready: function () {
      var R = G.R;
      if (R.step !== 'before') return;
      R.step = 'update';
      sfx('storm');
      var lv = R.level;
      stormUpdate();
      if (R.level > lv) S.once.stack = true;
      render(); scrollToBoard();
    },
    brace: function () {
      var R = G.R, nm = HZ[R.hz].name;
      if (R.step !== 'update') return;
      R.step = 'during';
      var need = R.level - R.prep;
      gsay({ text: nm + ' is here! Play During cards for ' + nm + '. Your Before cards still count. ' + (need > 0 ? 'You need ' + need + ' more.' : 'You already match it, but more never hurts.') + ' Then tap Face it.' });
      render();
    },
    face: function () {
      if (G.R.step !== 'during') return;
      hit(); render(); scrollToBoard();
    },
    next: function () {
      if (G.R.step !== 'after') return;
      endRound(); render(); scrollToBoard();
    },
    key: function (d) { var g = S.sheet; if (!g || g.kind !== 'gate' || g.entry.length >= 3) return; g.entry += String(d); g.wrong = false; render(); },
    bksp: function () { var g = S.sheet; if (!g || g.kind !== 'gate') return; g.entry = g.entry.slice(0, -1); render(); },
    ok: function () {
      var g = S.sheet;
      if (!g || g.kind !== 'gate') return;
      if (g.entry && Number(g.entry) === g.a * g.b) { var fn = gateThen; gateThen = null; S.sheet = null; sfx('good'); if (fn) fn(); else render(); }
      else { g.wrong = true; g.entry = ''; g.a = rnd(3, 9); g.b = rnd(6, 9); sfx('bad'); render(); }
    },
    easy: function () { S.sheet = null; gateThen = null; S.level = 'easy'; start(); }
  };

  /* ===== Events ===== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.getAttribute('aria-disabled') === 'true') return;
    var act = t.getAttribute('data-act');
    if (act === 'scrim' && e.target !== t) return;
    var fn = ACT[act];
    if (fn) { e.preventDefault(); fn(t.getAttribute('data-arg')); }
  });
  document.addEventListener('keydown', function (e) {
    if (S.sheet && e.key === 'Escape') { closeSheet(); return; }
    if (S.sheet && S.sheet.kind === 'gate') {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); ACT.key(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); ACT.bksp(); }
      else if (e.key === 'Enter' && e.target && e.target.tagName !== 'BUTTON') { e.preventDefault(); ACT.ok(); }
    }
  });
  window.addEventListener('pagehide', function () { TTS.stop(); });
  // For the tests (games/tests/handa-vs-hazard.test.cjs): the game's state and actions.
  window.__cards = { state: function () { return { S: S, G: G }; }, act: ACT, embed: EMBED };

  /* ===== Boot (keeps a game going if the page is updated while open) ===== */
  var hot = window.claude && window.claude.hot;
  function snapshot() { return JSON.parse(JSON.stringify({ level: S.level, sound: S.sound, okHard: S.okHard, screen: S.screen, G: G, uid: uid })); }
  var booted = false;
  function boot(data) {
    if (booted) return;
    booted = true;
    try {
      if (data && data.level) {
        S.level = data.level; S.sound = data.sound !== false; S.okHard = !!data.okHard;
        if (data.G && data.screen !== 'title') { G = data.G; uid = data.uid || 1000; S.screen = data.screen; }
      }
    } catch (e) { S.screen = 'title'; G = null; }
    if (EMBED) {
      S.level = params.get('level') === 'hard' ? 'hard' : 'easy';
      S.sound = params.get('sound') !== '0';
      S.voice = params.get('voice') !== '0';
      S.okHard = true; // the library already asked for a grown-up when the player's age called for one
      start();
      return;
    }
    render();
  }
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(snapshot); } catch (e) { /* ignore */ }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); } catch (e) { boot({}); } setTimeout(function () { boot({}); }, 1500); }
  else boot((hot && hot.data) || {});
})();
</script>
