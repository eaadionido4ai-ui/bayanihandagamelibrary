<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: one storybook column. A living scene window up top (home, school or indoor room) changes with the hazard.
   Chat style: comic-chat strip (portraits + balloons) in the card below. While the story plays, the scene stays
   pinned at the top and the chat scrolls under it (start and ending screens scroll normally).
   Cartoon style: characters stand inside the scene; a visual-novel dialogue box hangs underneath it. */
:root{
  --bg:#E3EBF0; --paper:#FFFDF7; --ink:#1B2938; --muted:#55667A; --line:#C7D3DC;
  --mango:#F4B400; --mango-ink:#332400;
  --good:#1D7F4F; --good-soft:#DAF1E3;
  --oops:#C4472D; --oops-soft:#FBE1DA;
  --sig:#1C5BA3; --sig-soft:#DBE7F5;
  --bubble:#FFFFFF; --you-bg:#FFF0C2; --think-bg:#EDF2F7; --radio-bg:#FFF5DE; --sms-bg:#DDF4E3; --caption:#FFF3CC; --scan:rgba(27,41,56,.05);
  --f-display:"Grandstander","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D151E; --paper:#16212C; --ink:#E6EDF3; --muted:#9BABBB; --line:#2C3B4A;
    --mango:#FFC53D; --mango-ink:#2A1D00;
    --good:#4CC48A; --good-soft:#123020;
    --oops:#FF7F69; --oops-soft:#3B1D17;
    --sig:#7DB1EC; --sig-soft:#1A2B40;
    --bubble:#1F2C39; --you-bg:#3A3015; --think-bg:#1D2833; --radio-bg:#2E2718; --sms-bg:#163223; --caption:#2D2714; --scan:rgba(230,237,243,.04);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D151E; --paper:#16212C; --ink:#E6EDF3; --muted:#9BABBB; --line:#2C3B4A;
  --mango:#FFC53D; --mango-ink:#2A1D00;
  --good:#4CC48A; --good-soft:#123020;
  --oops:#FF7F69; --oops-soft:#3B1D17;
  --sig:#7DB1EC; --sig-soft:#1A2B40;
  --bubble:#1F2C39; --you-bg:#3A3015; --think-bg:#1D2833; --radio-bg:#2E2718; --sms-bg:#163223; --caption:#2D2714; --scan:rgba(230,237,243,.04);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.9rem,6vw,2.4rem)}
h2{font-size:1.55rem}
h3{font-size:1.12rem}
h1:focus,h2:focus{outline:none}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:.82rem;font-weight:700;padding:4px 11px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stars-count{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700;font-variant-numeric:tabular-nums}
.stars-count .mini{width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid var(--ink)}
.stars-count .mini svg{width:100%;height:100%;display:block}
.stars-count .st{width:20px;height:20px;fill:var(--mango);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.stars-count.pop{animation:popper .55s ease}
@keyframes popper{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.linkbtn{font:inherit;font-size:.9rem;font-weight:700;color:var(--muted);background:none;border:0;padding:6px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* scene window */
.scene{position:relative;border-radius:var(--r);overflow:hidden;border:3px solid var(--ink);aspect-ratio:16/9;max-width:100%;background:#4FAFEA}
.scene[data-act]{cursor:pointer}
.scene svg.world{display:block;width:100%;height:100%}

/* chat style: pinned scene. The whole 16:9 picture stays visible; on short screens it shrinks instead of being cropped.
   --pinH (set by the script) tells the page how much room the pinned scene takes, so new lines scroll in just below it. */
html{scroll-padding-top:var(--pinH,0px)}
.wrap[data-pin="chat"] .stage{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:8px;margin-top:-8px}
.wrap[data-pin="chat"] .stage::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.wrap[data-pin="chat"] .scene{width:min(100%,60vh);width:min(100%,60svh);margin-inline:auto}
.scene{container-type:inline-size}
.chip{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:700;line-height:1.15;max-width:58%}
.chip-time{left:10px;bottom:10px}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.scene[data-mode="vn"] .chip-time{top:10px;bottom:auto;max-width:40%}
.chip-sig{right:10px;top:10px}
.sig-bars{display:flex;align-items:flex-end;gap:2px;height:16px;flex:none}
.sig-bars i{width:4px;background:var(--line);border-radius:1px}
.sig-bars i:nth-child(1){height:5px}.sig-bars i:nth-child(2){height:7.5px}.sig-bars i:nth-child(3){height:10px}.sig-bars i:nth-child(4){height:12.5px}.sig-bars i:nth-child(5){height:15px}
.sig-bars i.on{background:var(--sig)}
.swatch{flex:none;width:12px;height:18px;border-radius:3px;border:1.5px solid var(--ink)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--sig)}
.dot.alarm{background:var(--oops);animation:blink 1s linear infinite}
.dot.ok{background:var(--good)}

/* world: sets */
.set{display:none}
.scene[data-set="home"] .set-home,.scene[data-set="school"] .set-school,.scene[data-set="room"] .set-room{display:inline}
.scene[data-set="room"] .outdoor{display:none}

/* world: sky */
.scene .sky,.scene .sun,.scene .moon,.scene .stars-sky,.scene .bank{opacity:0;transition:opacity .9s ease}
.scene .shade{opacity:0;transition:opacity 1s ease}
.scene .puff{fill:#FFFFFF;transition:fill 1s ease,opacity 1s ease}
.scene .bank{fill:#5E6B78;transition:fill 1s ease,opacity .9s ease}
.scene[data-sky="sunny"] .sky-sunny,.scene[data-sky="sunny"] .sun{opacity:1}
.scene[data-sky="cloudy"] .sky-cloudy{opacity:1}
.scene[data-sky="cloudy"] .bank{opacity:.85}
.scene[data-sky="cloudy"] .puff{fill:#8D98A3}
.scene[data-sky="cloudy"] .shade{opacity:.12}
.scene[data-sky="rainy"] .sky-rainy{opacity:1}
.scene[data-sky="rainy"] .bank{opacity:1;fill:#4A5866}
.scene[data-sky="rainy"] .puff{fill:#76828F}
.scene[data-sky="rainy"] .shade{opacity:.22}
.scene[data-sky="dusk"] .sky-dusk{opacity:1}
.scene[data-sky="dusk"] .bank{opacity:1;fill:#2B3647}
.scene[data-sky="dusk"] .puff{fill:#3A475A}
.scene[data-sky="dusk"] .shade{opacity:.38}
.scene[data-sky="night"] .sky-night{opacity:1}
.scene[data-sky="night"] .bank{opacity:1;fill:#172436}
.scene[data-sky="night"] .puff{fill:#22324A}
.scene[data-sky="night"] .shade{opacity:.58}
.scene[data-sky="eye"] .sky-eye,.scene[data-sky="eye"] .moon,.scene[data-sky="eye"] .stars-sky{opacity:1}
.scene[data-sky="eye"] .puff{fill:#2C3E57}
.scene[data-sky="eye"] .c3{opacity:0}
.scene[data-sky="eye"] .shade{opacity:.5}
.scene[data-sky="morning"] .sky-morning,.scene[data-sky="morning"] .sun{opacity:1}
.scene[data-sky="morning"] .puff{fill:#FBF4EA}
.scene[data-sky="morning"] .shade{opacity:.04}

/* world: home set */
.wire{fill:none;stroke:#2A2A2A;stroke-width:1.3}
.win{fill:#CFE8F5;stroke:#3B2F25;stroke-width:2}
.scene .kite,.scene .debris,.scene .dog,.scene .wire-down,.scene .spark,.scene .rain,.scene .wind,.scene .glow,
.scene .neighbor,.scene .mud,.scene .waterline,.scene .rescue,.scene .rescue-lights,.scene .firetruck,.scene .ft-lights,.scene .soot,.scene .fire,.scene .plume{opacity:0;transition:opacity .9s ease}
.scene .wire-right{transition:opacity .9s ease}
.scene[data-fx~="rain"] .rain{opacity:1}
.scene[data-fx~="wind"] .wind{opacity:.7}
.scene[data-fx~="storm"] .wind{opacity:.85}
.scene[data-fx~="kite"] .kite{opacity:1}
.scene[data-fx~="debris"] .debris{opacity:1}
.scene[data-fx~="wiredown"] .wire-down,.scene[data-fx~="wiredown"] .spark{opacity:1}
.scene[data-fx~="wiredown"] .wire-right{opacity:0}
.scene[data-fx~="dog"] .dog{opacity:1}
.scene[data-fx~="neighbor"] .neighbor{opacity:1}
.scene[data-fx~="mud"] .mud{opacity:1}
.scene[data-fx~="waterline"] .waterline{opacity:1}
.scene[data-fx~="truck"] .rescue,.scene[data-fx~="truck"] .rescue-lights{opacity:1}
.scene[data-fx~="firetruck"] .firetruck,.scene[data-fx~="firetruck"] .ft-lights{opacity:1}
.scene[data-fx~="soot"] .soot{opacity:1}
.scene[data-fx~="fireglow"] .fire{opacity:1}
.scene[data-fx~="smoke"] .plume{opacity:1}
.water{transform:translateY(240px);transition:transform 1.6s ease}
.scene[data-fx~="flood1"] .water{transform:translateY(201px)}
.scene[data-fx~="flood2"] .water{transform:translateY(186px)}
.scene[data-fx~="flood3"] .water{transform:translateY(168px)}
.wave{animation:waves 3s linear infinite}
@keyframes waves{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.scene[data-light="flash"] .glow,.scene[data-light="candle"] .glow{opacity:1}
.scene[data-light="phone"] .glow{opacity:.55}
.gwin{fill:#FFF4C7}
.scene[data-light="candle"] .gwin{fill:#FFB04A}
.scene[data-light="phone"] .gwin{fill:#D7E3FF}
.scene[data-light="candle"] .glow{animation:flicker .5s ease-in-out infinite alternate}
@keyframes flicker{0%{opacity:1}35%{opacity:.7}70%{opacity:.95}100%{opacity:.78}}
.flames{transform-box:fill-box;transform-origin:50% 100%;animation:flame .45s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.88)}to{transform:scaleY(1.12)}}
.plume circle{transform-box:fill-box;transform-origin:center;animation:rise 4.5s linear infinite;opacity:0}
.plume .p2{animation-delay:-.9s}.plume .p3{animation-delay:-1.8s}.plume .p4{animation-delay:-2.7s}.plume .p5{animation-delay:-3.6s}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translate(-90px,-80px) scale(1.9);opacity:0}}
@keyframes lbA{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes lbB{0%,49%{opacity:.15}50%,100%{opacity:1}}
.lb-a{animation:lbA .7s linear infinite}
.lb-b{animation:lbB .7s linear infinite}

/* world: school set */
.scene .students,.scene .tents,.scene .evac-banner,.scene .police,.scene .police-lights,.scene .cracks,.scene .pots{opacity:0;transition:opacity .9s ease}
.scene[data-fx~="students"] .students{opacity:1}
.scene[data-fx~="tents"] .tents{opacity:1}
.scene[data-fx~="evac"] .evac-banner{opacity:1}
.scene[data-fx~="police"] .police,.scene[data-fx~="police"] .police-lights{opacity:1}
.scene[data-fx~="cracks"] .cracks{opacity:1}
.scene[data-fx~="pots"] .pots{opacity:1}

/* world: room set */
.room-wall{fill:#E9E3CB;transition:fill .6s ease}
.scene[data-room="bedroom"] .room-wall{fill:#D3E2EF}
.scene[data-room="living"] .room-wall{fill:#EBDDC8}
.prop-class,.prop-bed,.prop-living{display:none}
.scene[data-room="class"] .prop-class,.scene[data-room="bedroom"] .prop-bed,.scene[data-room="living"] .prop-living{display:inline}
.wpane{fill:#BFE3F7;transition:fill .8s ease}
.scene[data-sky="cloudy"] .wpane{fill:#AEB9C2}
.scene[data-sky="rainy"] .wpane{fill:#8E9AA6}
.scene[data-sky="dusk"] .wpane{fill:#5D6475}
.scene[data-sky="night"] .wpane,.scene[data-sky="eye"] .wpane{fill:#13233A}
.scene[data-sky="morning"] .wpane{fill:#F1DDBF}
.scene .room-dark,.scene .smoke-a,.scene .smoke-b,.scene .blinds,.scene .dcover,.scene .box-floor,.scene .box-moved,.scene .fallen,.scene .octo-glow,.scene .octo-spark,.scene .alarm-waves{opacity:0;transition:opacity .6s ease}
.scene .box-top{transition:opacity .4s ease}
.scene[data-fx~="dark"] .room-dark{opacity:.55}
.scene[data-fx~="dark"] .lamp-glow{opacity:0}
.scene[data-fx~="smoke1"] .smoke-a{opacity:.7}
.scene[data-fx~="smoke2"] .smoke-a{opacity:1}
.scene[data-fx~="smoke2"] .smoke-b{opacity:.85}
.scene[data-fx~="blinds"] .blinds,.scene[data-fx~="blinds"] .dcover{opacity:1}
.scene[data-fx~="boxfallen"] .box-top,.scene[data-fx~="boxmoved"] .box-top{opacity:0}
.scene[data-fx~="boxfallen"] .box-floor{opacity:1}
.scene[data-fx~="boxmoved"] .box-moved{opacity:1}
.scene[data-fx~="fallen"] .fallen{opacity:1}
.scene[data-fx~="octopus"] .octo-glow{animation:glowpulse 1.1s ease-in-out infinite alternate}
.scene[data-fx~="spark"] .octo-spark{animation:blink .4s linear infinite}
@keyframes glowpulse{from{opacity:.25}to{opacity:.75}}
.alarm-led{fill:#8A1F1F}
.scene[data-fx~="alarm"] .alarm-led{fill:#FF3B30;animation:blink .6s linear infinite}
.scene[data-fx~="alarm"] .alarm-waves{opacity:1;animation:blink .6s linear infinite}
.lamp{transform-box:view-box}
.lamp1{transform-origin:130px 0px}.lamp2{transform-origin:290px 0px}
@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.scene[data-fx~="shake"] .lamp{animation:swing .45s ease-in-out infinite alternate}
@keyframes quake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}100%{transform:translate(1px,0)}}
.scene[data-fx~="shake"] .shaker,.scene[data-fx~="shake"] .sprites{animation:quake .18s linear infinite}

/* world motion */
@keyframes sway{from{transform:rotate(calc(var(--a) * -1))}to{transform:rotate(var(--a))}}
.tree{transform-box:view-box;transform-origin:64px 200px;--a:.5deg;--t:4s;animation:sway var(--t) ease-in-out infinite alternate}
.fronds{transform-box:view-box;transform-origin:86px 76px;--a:3deg;--t:2.6s;animation:sway var(--t) ease-in-out infinite alternate}
.scene[data-fx~="breezy"] .tree{--a:2.5deg;--t:2s}
.scene[data-fx~="breezy"] .fronds{--a:7deg;--t:1.2s}
.scene[data-fx~="storm"] .tree{--a:6deg;--t:.9s}
.scene[data-fx~="storm"] .fronds{--a:13deg;--t:.55s}
.scene[data-fx~="still"] .tree{--a:0deg}
.scene[data-fx~="still"] .fronds{--a:1deg;--t:4s}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(12px)}}
.drift{--dt:9s;animation:drift var(--dt) ease-in-out infinite alternate}
.d2{animation-delay:-3s}.d3{animation-delay:-5s}
.scene[data-fx~="breezy"] .drift{--dt:4s}
.scene[data-fx~="storm"] .drift{--dt:1.8s}
@keyframes fall{from{transform:translate(0,0)}to{transform:translate(-96px,225px)}}
.rain-fall{animation:fall .45s linear infinite}
@keyframes gust{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
.wind path{stroke-dasharray:60 460;animation:gust var(--wt,2.4s) linear infinite}
.wind .w2{animation-delay:-.9s}.wind .w3{animation-delay:-1.6s}
.scene[data-fx~="storm"] .wind path{--wt:1.1s}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
.scene[data-fx~="wiredown"] .spark{animation:blink .8s linear infinite}

/* cartoon style: characters on stage */
.sprites,.sfx-layer{position:absolute;inset:0;pointer-events:none;display:none;z-index:2}
.scene[data-mode="vn"] .sprites{display:block}
.scene[data-mode="vn"] .sfx-layer{display:grid;place-items:center}
.sprite{position:absolute;bottom:-3px;height:72%;aspect-ratio:64/84;opacity:0;transform:translateY(16%);transition:opacity .3s ease,transform .3s ease}
.sprite.kid{height:62%}
.sp-left{left:3%}.sp-right{right:3%}
.sprite svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(2px 0 0 #1B2938) drop-shadow(-2px 0 0 #1B2938) drop-shadow(0 -2px 0 #1B2938) drop-shadow(0 6px 8px rgba(0,0,0,.3));transition:filter .3s ease}
.sprite.on{opacity:1;transform:none}
.sprite.dim svg{filter:drop-shadow(2px 0 0 #1B2938) drop-shadow(-2px 0 0 #1B2938) drop-shadow(0 -2px 0 #1B2938) brightness(.6) saturate(.6)}
.sprite.talk svg{animation:hop .42s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6%)}}
.sfx-layer .burst{width:min(62%,260px);height:auto;aspect-ratio:200/92}
.sfx-layer .burst span{font-size:clamp(1.5rem,6.5vw,2.3rem)}
.sfx-layer .burst span.long{font-size:clamp(1.05rem,4.4vw,1.6rem)}

/* cartoon style: dialogue box */
#vnbox{margin-top:4px}
.vnbox{--bb:var(--bubble);position:relative;background:var(--bb);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;min-height:118px;display:flex;flex-direction:column;gap:8px}
.vnbox[data-act]{cursor:pointer}
.vnbox.right{--bb:var(--you-bg)}
.vnbox.right .plate{align-self:flex-end}
.vnbox.think{--bb:var(--think-bg);border-radius:32px;padding-inline:20px}
.vnbox.radio{--bb:var(--radio-bg);border-radius:8px;background-image:repeating-linear-gradient(0deg,transparent 0 4px,var(--scan) 4px 5px)}
.vnbox.sms{--bb:var(--sms-bg)}
.vnbox.whisper{border-style:dashed}
.vnbox.caption{--bb:var(--caption);border-radius:6px;box-shadow:4px 4px 0 var(--ink);margin-right:4px}
.vnbox.sfx{--bb:var(--caption);border-radius:6px;box-shadow:4px 4px 0 var(--ink);margin-right:4px;align-items:center;justify-content:center;text-align:center}
.vnbox.sfx .vtext{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:.05em}
.plate{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:#1B2938;background:var(--pc);border:2px solid var(--ink);border-radius:999px;padding:2px 12px}
.vtext{font-size:1.12rem;line-height:1.5;overflow-wrap:anywhere}
.vfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:auto}
.vfoot:empty{display:none}
.vnbox.left::before,.vnbox.left::after,.vnbox.right::before,.vnbox.right::after{content:"";position:absolute;width:0;height:0;border-style:solid}
.vnbox.left::before{left:calc(18.4% - 11px);top:-19px;border-width:0 11px 19px 11px;border-color:transparent transparent var(--ink) transparent}
.vnbox.left::after{left:calc(18.4% - 7px);top:-12px;border-width:0 7px 13px 7px;border-color:transparent transparent var(--bb) transparent}
.vnbox.right::before{right:calc(18.4% - 11px);top:-19px;border-width:0 11px 19px 11px;border-color:transparent transparent var(--ink) transparent}
.vnbox.right::after{right:calc(18.4% - 7px);top:-12px;border-width:0 7px 13px 7px;border-color:transparent transparent var(--bb) transparent}
.vnbox.whisper::before{border-color:transparent transparent var(--ink) transparent}
.vnbox.think::before,.vnbox.think::after{border:3px solid var(--ink);background:var(--bb);border-radius:50%}
.vnbox.think::before{width:18px;height:18px;right:calc(18.4% - 9px);top:-27px}
.vnbox.think::after{width:11px;height:11px;right:calc(18.4% - 1px);top:-45px}

/* story card */
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sig)}
.head{display:flex;flex-direction:column;gap:4px}
.callout{border:2px solid var(--oops);background:var(--oops-soft);border-radius:12px;padding:12px 14px;font-size:.95rem}

/* chat style: dialogue strip */
.dialog{display:flex;flex-direction:column;gap:16px}
.dialog[data-act]{cursor:pointer}
.row{display:flex;align-items:flex-end;gap:10px}
.row.right{flex-direction:row-reverse}
.avatar{flex:none;width:54px;height:54px;border-radius:50%;overflow:hidden;border:2.5px solid var(--ink);background:var(--paper)}
.avatar svg{width:100%;height:100%;display:block}
.bwrap{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:calc(100% - 64px);align-items:flex-start}
.right .bwrap{align-items:flex-end}
.name{font-family:var(--f-display);font-weight:800;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-inline:8px;display:inline-flex;align-items:center;gap:6px}
.onair{width:8px;height:8px;border-radius:50%;background:var(--oops);animation:blink 1.2s linear infinite}
.bubble{--bb:var(--bubble);position:relative;background:var(--bb);border:2.5px solid var(--ink);border-radius:20px;padding:10px 14px;font-size:1.02rem;line-height:1.45;overflow-wrap:anywhere}
.bubble::before,.bubble::after{content:"";position:absolute;width:0;height:0;border-style:solid}
.left .bubble::before{left:-13px;bottom:10px;border-width:8px 13px 8px 0;border-color:transparent var(--ink) transparent transparent}
.left .bubble::after{left:-8px;bottom:12.5px;border-width:5.5px 9px 5.5px 0;border-color:transparent var(--bb) transparent transparent}
.right .bubble{--bb:var(--you-bg)}
.right .bubble::before{right:-13px;bottom:10px;border-width:8px 0 8px 13px;border-color:transparent transparent transparent var(--ink)}
.right .bubble::after{right:-8px;bottom:12.5px;border-width:5.5px 0 5.5px 9px;border-color:transparent transparent transparent var(--bb)}
.row.think .bubble{--bb:var(--think-bg);border-radius:28px;padding:12px 18px}
.row.think .bubble::before,.row.think .bubble::after{border:2.5px solid var(--ink);border-radius:50%;background:var(--bb)}
.row.think .bubble::before{width:14px;height:14px;right:-15px;left:auto;bottom:-6px}
.row.think .bubble::after{width:8px;height:8px;right:-25px;left:auto;bottom:-14px}
.row.radio .bubble{--bb:var(--radio-bg);border-radius:8px;background-image:repeating-linear-gradient(0deg,transparent 0 4px,var(--scan) 4px 5px)}
.row.sms .bubble{--bb:var(--sms-bg);border-radius:20px 20px 20px 6px}
.row.whisper .bubble{border-style:dashed}
.caption{align-self:stretch;background:var(--caption);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:4px;padding:10px 14px;font-size:1rem;margin-right:3px}
.sfx{display:flex;justify-content:center}
.burst{position:relative;width:200px;height:92px;display:grid;place-items:center;transform:rotate(var(--rot,-4deg))}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst polygon{fill:var(--mango);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.burst span{position:relative;font-family:var(--f-display);font-weight:800;font-size:1.75rem;letter-spacing:.03em;color:var(--mango-ink);text-align:center;line-height:1.05;padding-inline:24px}
.burst span.long{font-size:1.2rem}
.pop{animation:bubbleIn .38s cubic-bezier(.2,.9,.3,1.25) both}
.sfx.pop .burst,.burst.pop{animation:burstIn .45s cubic-bezier(.2,.9,.3,1.4) both}
.sfx.pop .burst{animation-delay:inherit}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes burstIn{from{transform:rotate(var(--rot,-4deg)) scale(.4)}to{transform:rotate(var(--rot,-4deg)) scale(1)}}
.tap-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.tapnext{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-bottom-width:4px;border-radius:999px;padding:8px 18px;cursor:pointer}
.tapnext svg{width:14px;height:14px;fill:currentColor;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.tapnext:hover{background:var(--sig-soft)}
.tapnext:active{transform:translateY(2px);border-bottom-width:2px}

/* choices */
.prompt{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-bottom-width:5px;border-radius:14px;padding:13px 16px;cursor:pointer;transition:transform .12s ease,background .12s ease}
.choice:hover{background:var(--sig-soft);transform:translateY(-2px)}
.choice:active{transform:translateY(2px);border-bottom-width:3px}
.key{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mango);color:var(--mango-ink);border:2px solid var(--ink);font-family:var(--f-display);font-weight:800;font-size:.95rem}
.btn{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--mango-ink);background:var(--mango);border:2px solid var(--ink);border-bottom-width:5px;border-radius:14px;padding:11px 22px;cursor:pointer;transition:transform .12s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
button:focus-visible{outline:3px solid var(--sig);outline-offset:3px}

.feedback{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.feedback.good{background:var(--good-soft)}
.feedback.bad{background:var(--oops-soft)}
.feedback.meh{background:var(--sig-soft)}
.fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.feedback.good h3{color:var(--good)}
.feedback.bad h3{color:var(--oops)}
.feedback.meh h3{color:var(--sig)}
.earned{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:700;background:var(--paper);border-radius:999px;padding:2px 10px 2px 6px}
.earned svg{width:16px;height:16px;fill:var(--mango);stroke:var(--ink);stroke-width:1.4}
.tip-lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--paper)}
.mark svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mark.good{background:var(--good)}
.mark.bad{background:var(--oops)}
.mark.meh,.mark.ok{background:var(--sig)}

/* go bag */
.bag-status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.slots{display:flex;gap:6px}
.slots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.slots i.on{background:var(--mango)}
.full-msg{color:var(--oops);font-weight:700;font-size:.92rem}
.bag-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.item{--tile:var(--paper);position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border:2px solid var(--line);border-radius:14px;background:var(--tile);color:var(--ink);font:inherit;font-size:.86rem;font-weight:700;line-height:1.2;text-align:center;cursor:pointer;min-width:0}
.item:hover{border-color:var(--ink)}
.item[aria-pressed="true"]{--tile:var(--sig-soft);border-color:var(--sig)}
.ico{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico .fillp{fill:var(--tile,var(--paper))}
.tick{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--sig);color:var(--paper);display:none;place-items:center}
.tick svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.item[aria-pressed="true"] .tick{display:grid}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;--tile:var(--paper)}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li .ico{width:28px;height:28px}
.list .txt{display:flex;flex-direction:column;min-width:0}
.list .txt span{color:var(--muted);font-size:.94rem}

/* start + endings */
.mode-grid,.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode,.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-bottom-width:5px;border-radius:16px;cursor:pointer;text-align:center;transition:transform .12s ease,background .12s ease;min-width:0}
.mode:hover,.pick:hover{background:var(--sig-soft);transform:translateY(-2px)}
.mode:active,.pick:active{transform:translateY(2px);border-bottom-width:3px}
.mode[aria-pressed="true"]{background:var(--sig-soft);border-color:var(--sig)}
.mode[aria-pressed="true"] .tick{display:grid}
.mode b,.pick b{font-family:var(--f-display);font-size:1.12rem}
.mode small,.pick small{color:var(--muted);font-size:.85rem;line-height:1.3}
.pv{width:100%;max-width:150px;height:auto}
.pv-a{fill:var(--mango);stroke:var(--ink);stroke-width:2}
.pv-b{fill:var(--bubble);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.pv-c{fill:var(--sig);stroke:var(--ink);stroke-width:2}
.pv-y{fill:var(--you-bg);stroke:var(--ink);stroke-width:2}
.pv-sky{fill:var(--sig-soft);stroke:var(--ink);stroke-width:2}
.pv-g{fill:var(--good);opacity:.55}
.pv-l{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round}
.pick .avatar{width:76px;height:76px;border-width:3px}
.cast{display:flex;flex-wrap:wrap;gap:10px 14px}
.cast div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.8rem;font-weight:700;max-width:64px;text-align:center;line-height:1.2}
.cast .avatar{width:46px;height:46px;border-width:2px}
.end-top{display:flex;align-items:center;gap:16px}
.end-top svg{flex:none}
.stars-row{display:flex;gap:4px;flex-wrap:wrap}
.stars-row svg{width:28px;height:28px;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.stars-row .full{fill:var(--mango)}
.stars-row .empty{fill:none;stroke:var(--line)}
.muted{color:var(--muted)}
.found-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.found{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.8rem;font-weight:700;line-height:1.2}
.found.no{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--line);padding-top:14px}
.section.first{border-top:0;padding-top:0}
.note{font-size:.9rem;color:var(--muted)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

@media (max-width:440px){
  .card{padding:16px}
  .bag-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{flex-direction:row;text-align:left;padding:10px 28px 10px 10px}
  .ico{width:30px;height:30px}
  .tick{top:50%;transform:translateY(-50%)}
  .avatar{width:46px;height:46px}
  .bwrap{max-width:calc(100% - 56px)}
  .bubble{font-size:1rem;padding:9px 12px}
  .vtext{font-size:1.05rem}
  .chip{font-size:11.5px;padding:3px 7px}
}
/* phones held sideways: in chat style the pinned scene sits on the left and the chat scrolls on the right */
@media (orientation: landscape) and (max-height: 520px){
  .wrap[data-pin="chat"]{max-width:1000px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:16px;align-items:start}
  .wrap[data-pin="chat"] .topbar{grid-column:1 / -1}
  .wrap[data-pin="chat"] .stage{grid-column:1;grid-row:2;top:12px;padding-top:0;margin-top:0;background:none}
  .wrap[data-pin="chat"] .stage::after{display:none}
  .wrap[data-pin="chat"] .scene{width:100%}
  .wrap[data-pin="chat"] #card{grid-column:2;grid-row:2}
}
/* status chips follow the size of the scene itself (it can be small when pinned), not just the screen */
@container (max-width: 400px){
  .chip{font-size:11.5px;padding:3px 7px}
}
@container (max-width: 300px){
  .chip{font-size:10.5px;padding:2px 6px;gap:5px;border-radius:8px}
  .chip small{display:none}
  .chip-time{left:6px;bottom:6px}
  .chip-sig{right:6px;top:6px}
  .scene[data-mode="vn"] .chip-time{top:6px}
}
/* ===== BAYANIHanda Game Library look (html[data-skin="bh"], set when the story runs inside the library) =====
   Fonts are the library's own Baloo 2 and Nunito, served from fonts/ next to this page so they work offline. */
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:italic;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-italic.woff2) format("woff2")}
html[data-skin="bh"]{
  --bg:#e8f2f7; --paper:#FFFFFF; --ink:#16303f; --muted:#4f6572; --line:#d5e3ea;
  --mango:#ffc53d; --mango-ink:#4a2a00;
  --good:#128253; --good-soft:#e5f6ee;
  --oops:#c62f22; --oops-soft:#fde8e4;
  --sig:#2a6b8f; --sig-soft:#e6f3f9;
  --bubble:#FFFFFF; --you-bg:#fff5df; --think-bg:#FFFFFF; --radio-bg:#fff5df; --sms-bg:#e5f6ee; --caption:#e3eff4; --scan:transparent;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,sans-serif;
  --r:22px;
  color-scheme:light;
}
html[data-skin="bh"] body{font-weight:700;font-size:16px}
html[data-skin="bh"] .topbar{justify-content:flex-start}
html[data-skin="bh"] .top-right{margin-left:auto}
html[data-skin="bh"] .backbtn{width:44px;height:44px;border-radius:15px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font:900 19px/1 var(--f-body);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
html[data-skin="bh"] .backbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
html[data-skin="bh"] .brand{font-size:1.3rem}
html[data-skin="bh"] .brand svg{display:none}
html[data-skin="bh"] .seg{border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
html[data-skin="bh"] .seg button{font-weight:900;padding:5px 12px}
html[data-skin="bh"] .seg button[aria-pressed="true"]{background:var(--good);color:#fff}
html[data-skin="bh"] .stars-count{box-shadow:0 3px 0 var(--line)}
html[data-skin="bh"] .scene{border:3px solid #fff;box-shadow:0 5px 0 rgba(20,48,66,.12)}
html[data-skin="bh"] .chip{border:none;border-radius:12px;box-shadow:0 3px 0 rgba(20,48,66,.15);font-weight:900}
html[data-skin="bh"] .chip small{font-weight:700}
html[data-skin="bh"] .card{background:transparent;border:none;padding:4px 2px 0}
html[data-skin="bh"] .avatar{border:2px solid #fff;box-shadow:0 2px 0 var(--line)}
html[data-skin="bh"] .name{font-family:var(--f-body);font-weight:900;font-size:.7rem;letter-spacing:.06em}
html[data-skin="bh"] .bubble{border:2px solid var(--line);border-radius:18px 18px 18px 6px;font-weight:700;font-size:1rem}
html[data-skin="bh"] .right .bubble{border-radius:18px 18px 6px 18px;border-color:#ffe2a8}
html[data-skin="bh"] .bubble::before,html[data-skin="bh"] .bubble::after{display:none}
html[data-skin="bh"] .row.think .bubble{border-style:dashed;border-color:#b9ccd8;border-radius:22px;font-style:italic}
html[data-skin="bh"] .row.radio .bubble{border-color:#ffe2a8;background-image:none;border-radius:18px 18px 18px 6px}
html[data-skin="bh"] .row.sms .bubble{border-color:#bfe9d4}
html[data-skin="bh"] .row.whisper .bubble{border-style:dashed}
html[data-skin="bh"] .caption{border:none;box-shadow:none;border-radius:14px;font-weight:800;color:#3d5563;text-align:center;margin-right:0}
html[data-skin="bh"] .tapnext{border:2px solid var(--line);border-bottom-width:2px;box-shadow:0 4px 0 var(--line);font-family:var(--f-body);font-weight:900}
html[data-skin="bh"] .tapnext:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
html[data-skin="bh"] .choice{border:none;border-radius:18px;box-shadow:0 5px 0 rgba(20,48,66,.1);font-weight:800}
html[data-skin="bh"] .choice:hover{background:#f4fafc}
html[data-skin="bh"] .choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,48,66,.1)}
html[data-skin="bh"] .key{border:none}
html[data-skin="bh"] .btn{border:none;border-radius:999px;background:#d9650a;color:#fff;box-shadow:0 6px 0 #a34a05;padding:12px 24px 9px}
html[data-skin="bh"] .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a34a05}
html[data-skin="bh"] .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-body);font-weight:900;font-size:1rem;padding:11px 18px}
html[data-skin="bh"] .btn.ghost:active{box-shadow:0 1px 0 var(--line)}
html[data-skin="bh"] .feedback{border-radius:18px}
html[data-skin="bh"] .item{border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line)}
html[data-skin="bh"] .item[aria-pressed="true"]{border-color:var(--good);--tile:var(--good-soft)}
html[data-skin="bh"] .tick{background:var(--good)}
html[data-skin="bh"] .vnbox{border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 rgba(20,48,66,.08)}
html[data-skin="bh"] .vnbox.left::before,html[data-skin="bh"] .vnbox.right::before{border-bottom-color:var(--line)}
html[data-skin="bh"] .vnbox.think::before,html[data-skin="bh"] .vnbox.think::after{border-color:var(--line)}
html[data-skin="bh"] .vnbox.radio{background-image:none;border-color:#ffe2a8}
html[data-skin="bh"] .vnbox.caption,html[data-skin="bh"] .vnbox.sfx{border:none;border-radius:16px;box-shadow:none}
html[data-skin="bh"] .plate{border:none;box-shadow:0 2px 0 rgba(0,0,0,.12);font-family:var(--f-body);font-weight:900}

@media (prefers-reduced-motion: reduce){
  .scene *,.pop,.sfx.pop .burst,.burst.pop,.onair,.tapnext svg,.sprite.talk svg,.scene .sprites,.scene .shaker{animation:none !important}
  .scene *{transition:none !important}
  .stars-count.pop{animation:none}
  .choice,.btn,.pick,.mode{transition:none}
}
</style>

<div class="wrap" id="top">
  <div class="topbar">
    <button class="backbtn" id="backBtn" data-act="exit" aria-label="Back to the stories" hidden>←</button>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 8.8C12 4.5 15.5 3 19 3.8M12 15.2c0 4.3-3.5 5.8-7 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      {{BRAND}}
    </div>
    <div class="top-right" id="topRight" hidden>
      <div class="seg" role="group" aria-label="Story style">
        <button data-act="mode" data-mode="chat" id="segChat">Chat</button>
        <button data-act="mode" data-mode="vn" id="segVn">Cartoon</button>
      </div>
      <div class="stars-count" id="starsCount"></div>
      <button class="linkbtn" data-act="restart">Start over</button>
    </div>
  </div>

  <div class="stage" id="stage">
  <div class="scene" id="scene" data-set="home" data-sky="sunny" data-fx="" data-room="" data-light="day" data-mode="chat">
    <svg class="world" viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="gSunny" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FAFEA"/><stop offset="1" stop-color="#C4E7F8"/></linearGradient>
        <linearGradient id="gCloudy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A7886"/><stop offset="1" stop-color="#B7C1C9"/></linearGradient>

    return `<div class="row ${isYou ? 'right' : 'left'} ${kindOf(p)}${pop}">
      <div class="avatar">${portrait(p.who, p.mood)}</div>
      <div class="bwrap"><span class="name">${labelFor(p)}</span><div class="bubble">${sub(p.think || p.say)}</div></div>
    </div>`;
  }

  /* cartoon-style dialogue box */
  function vnBoxHTML(p, more, animate){
    let side = 'none', kind = 'caption', plate = '', text = '';
    if (typeof p === 'string'){ text = sub(p); }
    else if (p.sfx){ kind = 'sfx'; text = p.sfx; }
    else {
      side = p.who === 'you' ? 'right' : 'left';
      kind = kindOf(p);
      plate = `<span class="plate" style="--pc:${plateColor(p.who)}">${labelFor(p)}</span>`;
      text = sub(p.think || p.say);
    }
    const foot = more ? `<button class="linkbtn" data-act="skip">Skip</button><button class="tapnext" data-act="more">Next ${NEXT_ARROW}</button>` : '';
    return `<div class="vnbox ${side} ${kind}${animate ? ' pop' : ''}"${more ? ' data-act="more"' : ''}>${plate}<p class="vtext">${text}</p><div class="vfoot">${foot}</div></div>`;
  }
  function stageCast(lines, idx){
    let left = null, right = null, cur = null;
    for (let i = 0; i <= idx && i < lines.length; i++){
      const p = lines[i];
      cur = p;
      if (typeof p === 'string' || p.sfx){ left = null; right = null; continue; }
      if (p.who === 'you') right = p; else left = p;
    }
    return {left, right, cur};
  }
  function setSprite(side, line, speaking, talk){
    const el = $(side === 'L' ? 'spL' : 'spR');
    const base = `sprite ${side === 'L' ? 'sp-left' : 'sp-right'}`;
    if (!line){ el.className = base; return; }
    const key = line.who + ':' + (line.mood || 'calm') + ':' + state.hero;
    if (el.dataset.key !== key){ el.innerHTML = figure(line.who, line.mood); el.dataset.key = key; }
    el.className = `${base} on${speaking ? '' : ' dim'}${KIDS.has(line.who) ? ' kid' : ''}`;
    if (speaking && talk){ void el.offsetWidth; el.classList.add('talk'); }
  }

  function renderTop(){
    const tr = $('topRight');
    if (state.at === 'start'){ tr.hidden = true; return; }
    tr.hidden = false;
    $('segChat').setAttribute('aria-pressed', state.mode === 'chat');
    $('segVn').setAttribute('aria-pressed', state.mode === 'vn');
    $('starsCount').innerHTML = `<span class="mini">${portrait('you','happy')}</span>${starSVG('st')}<span>${state.stars}</span><span class="sr"> safety stars</span>`;
  }

  function foundRow(size){
    return `<div class="found-grid">${ORDER.map(k => `<div class="found ${found.has(k) ? '' : 'no'}">${medal(k, size, found.has(k))}<span>${found.has(k) ? ENDINGS[k].name : '???'}</span></div>`).join('')}</div>`;
  }
  function feedbackHTML(L, delay){
    const pop = delay >= 0 ? ` pop" style="animation-delay:${delay}ms` : '';
    return `<div class="feedback ${L.kind}${pop}">
      <div class="fb-head"><span class="mark ${L.kind}">${MARK[L.kind]}</span><h3>${L.head}</h3>${L.kind === 'good' ? `<span class="earned">${starSVG()}+1 star</span>` : ''}</div>
      <p><span class="tip-lbl">Safety tip</span>${L.tip}</p>
    </div>`;
  }
  function bagListHTML(delay){
    const pop = delay >= 0 ? ` pop" style="animation-delay:${delay}ms` : '';
    return `<ul class="list${pop}">${state.bag.map(id => { const it = itemById(id); return `<li><span class="mark ${it.kind}">${MARK[it.kind]}</span>${icon(it)}<div class="txt"><b>${it.name}</b><span>${it.note}</span></div></li>`; }).join('')}</ul>`;
  }
  const continueHTML = L => `<button class="btn" data-act="next">${L.next === 'END' ? 'See my ending' : 'Continue'}</button>`;
  function bagPickHTML(sc){
    const n = state.picks.length;
    const list = (sc.items || DEFAULT_ITEMS).map(itemById);
    return `
      <div class="bag-status"><span>Packed ${n} of ${sc.pick}</span><span class="slots" aria-hidden="true">${Array.from({length: sc.pick}, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span></div>
      ${state.full ? '<p class="full-msg" role="alert">Your bag is full! Tap an item to take it out.</p>' : ''}
      <div class="bag-grid">${list.map(it => `<button class="item" data-act="toggle" data-id="${it.id}" aria-pressed="${state.picks.includes(it.id)}">${TICK}${icon(it)}<span>${it.name}</span></button>`).join('')}</div>
      <button class="btn" data-act="zip" ${n === sc.pick ? '' : 'disabled'}>Zip up the Go Bag</button>`;
  }
  function choicesHTML(sc){
    return `<p class="prompt">What will you do?</p><div class="choices" role="group" aria-label="What will you do?">${choicesOf(sc).map((c, i) => `<button class="choice" data-act="choose" data-i="${i}"><span class="key" aria-hidden="true">${'ABC'[i]}</span><span>${c.label}</span></button>`).join('')}</div>`;
  }

  function startHTML(){
    return `
      <div class="head"><p class="kicker">A choose-your-path ${STORY.hazard} game</p><h1 tabindex="-1">${STORY.heading}</h1></div>
      <p>${STORY.intro}</p>
      ${STORY.contentNote ? `<p class="callout">${STORY.contentNote}</p>` : ''}
      <div class="section first"><h3>1. Choose how to see the story</h3>
        <div class="mode-grid" role="group" aria-label="Story style">
          <button class="mode" data-act="mode" data-mode="chat" aria-pressed="${state.mode === 'chat'}">${TICK}${PREVIEW.chat}<b>Chat style</b><small>Like messages in a group chat</small></button>
          <button class="mode" data-act="mode" data-mode="vn" aria-pressed="${state.mode === 'vn'}">${TICK}${PREVIEW.vn}<b>Cartoon style</b><small>Characters appear in the scene, like a cartoon</small></button>
        </div>
        <p class="note">You can switch styles anytime during the game.</p>
      </div>
      <div class="section"><h3>2. Pick your character to start</h3>
        <div class="pick-grid">
          <button class="pick" data-act="begin" data-hero="ate"><span class="avatar">${face(LOOKS.youGirl,'happy')}</span><b>Play as Ate</b><small>Migo’s big sister</small></button>
          <button class="pick" data-act="begin" data-hero="kuya"><span class="avatar">${face(LOOKS.youBoy,'happy')}</span><b>Play as Kuya</b><small>Migo’s big brother</small></button>
        </div>
      </div>
      <div class="section"><h3>Meet the people in this story</h3>
        <div class="cast">${STORY.cast.map(w => `<div><span class="avatar">${portrait(w, KIDS.has(w) ? 'happy' : 'calm')}</span>${NAMES[w]}</div>`).join('')}</div>
      </div>
      <div class="section"><h3>Endings found: ${found.size} of ${ORDER.length}</h3>${foundRow(52)}</div>
      <p class="note">${STORY.grownups}</p>`;
  }
  function endHTML(withLine){
    const E = ENDINGS[state.ending];
    const stars = Array.from({length: state.scored}, (_, i) => starSVG(i < state.stars ? 'full' : 'empty')).join('');
    return `
      <div class="end-top">${medal(state.ending, 92, true)}<div class="head"><p class="kicker">You found an ending</p><h2 tabindex="-1">${E.name}</h2></div></div>
      ${withLine ? `<div class="dialog">${lineHTML(E.line, rm() ? -1 : 150)}</div>` : ''}
      <p>${E.text}</p>
      <div><div class="stars-row" role="img" aria-label="${state.stars} of ${state.scored} safety stars">${stars}</div><p class="muted">${state.stars} of ${state.scored} safety stars</p></div>
      <div class="section"><h3>What you learned</h3>
        <ul class="list">${state.log.map(l => `<li><span class="mark ${l.kind}">${MARK[l.kind]}</span><div class="txt"><b>${l.label}</b><span>${l.tip}</span></div></li>`).join('')}</ul>
      </div>
      <div class="section"><h3>Endings found: ${found.size} of ${ORDER.length}</h3>${foundRow(52)}</div>
      <div class="actions"><button class="btn" data-act="restart">Play again</button>${EMBED ? '<button class="btn ghost" data-act="exit">Back to the stories</button>' : ''}${found.size < ORDER.length ? '<span class="muted">Try different choices to find another ending.</span>' : '<span class="muted">You found every ending. Amazing!</span>'}</div>`;
  }

  function render(newScene){
    sfxCount = 0;
    const vn = state.mode === 'vn';
    sceneEl.dataset.mode = state.mode;
    if (!vn && state.at !== 'start' && state.at !== 'end') wrapEl.dataset.pin = 'chat'; else delete wrapEl.dataset.pin;
    const sc = STORY.scenes[state.at];

    if (state.at === 'start') setScene(STORY.startVis, STORY.startChip, null, 'day');
    else if (state.at === 'end') setScene(STORY.endVis, STORY.endChip, STORY.endStatus, STORY.endLight || 'day');
    else {
      const fb = state.phase === 'feedback' && state.last;
      const vis = (fb && state.last.fxVis) || sc.vis;
      const light = (fb && state.last.light) || sc.light || 'day';
      setScene(vis, vn ? `<span><small>${sc.time}</small>${sc.title}</span>` : sc.time, sc.status, light);
    }
    renderTop();

    let html = '', boxHTML = '', left = null, right = null, cur = null, more = false;

    if (state.at === 'start'){
      html = startHTML();
    }
    else if (state.at === 'end'){
      html = endHTML(!vn);
      if (vn){
        const l = ENDINGS[state.ending].line;
        cur = l;
        if (l.who === 'you') right = l; else left = l;
        boxHTML = vnBoxHTML(l, false, newScene && !rm());
      }
    }
    else if (vn){
      const story = textOf(sc);
      let all, total, base;
      if (state.phase === 'choose'){ all = story; total = story.length; base = 0; }
      else { const fb = fbLines(); all = story.concat(fb); total = fb.length; base = story.length; }
      const r = Math.max(1, Math.min(state.reveal, total));
      more = r < total;
      const cast = stageCast(all, base + r - 1);
      left = cast.left; right = cast.right; cur = cast.cur;
      boxHTML = vnBoxHTML(cur, more, (anim === 'line' || newScene) && !rm());
      if (!more){
        if (state.phase === 'choose') html = sc.type === 'bag' ? bagPickHTML(sc) : choicesHTML(sc);
        else {
          const L = state.last;
          html = (L.bag ? bagListHTML(-1) : '') + feedbackHTML(L, anim === 'line' && !rm() ? 0 : -1) + continueHTML(L);
        }
      }
    }
    else {
      const lines = textOf(sc);
      html = `<div class="head"><p class="kicker">${sc.time}</p><h2 tabindex="-1">${sc.title}</h2></div>`;
      if (state.phase === 'choose'){
        const shown = lines.slice(0, Math.min(state.reveal, lines.length));
        more = state.reveal < lines.length;
        html += `<div class="dialog"${more ? ' data-act="more"' : ''}>${shown.map((p, i) => lineHTML(p, anim === 'line' && i === shown.length - 1 ? 0 : -1)).join('')}</div>`;
        if (more) html += `<div class="tap-row"><button class="tapnext" data-act="more">Next ${NEXT_ARROW}</button><button class="linkbtn" data-act="skip">Skip to choices</button></div>`;
        else html += sc.type === 'bag' ? bagPickHTML(sc) : choicesHTML(sc);
      } else {
        const L = state.last;
        const go = anim === 'result' && !rm();
        let k = 0;
        const d = () => go ? (k++) * 380 : -1;
        const newLines = fbLines().map(p => lineHTML(p, d())).join('');
        const bag = L.bag ? bagListHTML(d()) : '';
        html += `<div class="dialog">${lines.map(p => lineHTML(p, -1)).join('')}<div id="newStart"></div>${newLines}</div>${bag}${feedbackHTML(L, d())}${continueHTML(L)}`;
      }
    }

    card.innerHTML = html;
    card.hidden = !html;
    box.innerHTML = boxHTML;
    box.hidden = !boxHTML;
    const talk = (anim === 'line' || newScene) && !rm();
    setSprite('L', vn ? left : null, !!cur && cur === left, talk);
    setSprite('R', vn ? right : null, !!cur && cur === right, talk);
    const fx = $('sfxLayer');
    fx.innerHTML = (vn && cur && cur.sfx) ? `<div class="burst${talk ? ' pop' : ''}" style="--rot:-5deg">${BURST}<span${cur.sfx.length > 9 ? ' class="long"' : ''}>${cur.sfx}</span></div>` : '';
    if (vn && more) sceneEl.setAttribute('data-act', 'more'); else sceneEl.removeAttribute('data-act');

    pinRoom();
    const behavior = rm() ? 'auto' : 'smooth';
    if (newScene){
      const top = $('top');
      if (top.getBoundingClientRect().top < 0) top.scrollIntoView({behavior, block:'start'});
      const target = (vn && box.querySelector('.tapnext')) || card.querySelector('h1, h2') || card.querySelector('button');
      if (target) target.focus({preventScroll:true});
    } else if (anim === 'line'){
      if (vn){
        const nb = box.querySelector('.tapnext');
        if (nb){ nb.focus({preventScroll:true}); box.scrollIntoView({behavior, block:'nearest'}); }
        else {
          const first = card.querySelector('.choice, .item, [data-act="next"]');
          if (first) first.focus({preventScroll:true});
          if (!card.hidden) card.scrollIntoView({behavior, block:'nearest'});
        }
      } else {
        const rows = card.querySelectorAll('.dialog > *');
        const last = card.querySelector('.tap-row') || rows[rows.length - 1];
        if (last) last.scrollIntoView({behavior, block:'nearest'});
        const nb = card.querySelector('.tapnext') || card.querySelector('.choice, .item');
        if (nb) nb.focus({preventScroll:true});
        if (!card.querySelector('.tapnext')){
          const tail = card.querySelector('.choices, .bag-grid');
          if (tail) setTimeout(() => tail.scrollIntoView({behavior, block:'nearest'}), 50);
        }
      }
    } else if (anim === 'result'){
      const ns = $('newStart');
      if (ns) ns.scrollIntoView({behavior, block:'start'});
      const b = card.querySelector('[data-act="next"]'); if (b) b.focus({preventScroll:true});
    }
    anim = null;
  }

  function popStar(){
    const el = $('starsCount');
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  function totalLines(){
    const sc = STORY.scenes[state.at];
    if (!sc) return 0;
    if (state.phase === 'choose') return textOf(sc).length;
    if (state.phase === 'feedback' && state.mode === 'vn') return fbLines().length;
    return 0;
  }
  function more(){
    const total = totalLines();
    if (state.reveal >= total) return;
    state.reveal++;
    anim = 'line';
    render(false);
  }
  function skip(){
    const total = totalLines();
    if (!total) return;
    state.reveal = total;
    anim = 'line';
    render(false);
  }

  function choose(i){
    const sc = STORY.scenes[state.at];
    const c = choicesOf(sc)[i];
    if (!c) return;
    state.scored++;
    if (c.kind === 'good') state.stars++;
    if (c.path) state.path = c.path;
    if (c.flag) [].concat(c.flag).forEach(f => { state.flags[f] = true; });
    state.log.push({label:c.label, kind:c.kind, tip:c.tip});
    const next = typeof c.next === 'function' ? c.next(state) : c.next;
    state.last = {label:c.label, say:c.say || '', think:c.think || '', whisper:!!c.whisper, mood:c.mood || 'calm', kind:c.kind, head:c.head, result:c.result, tip:c.tip, next, fxVis: c.fxVis ? resolveVis(c.fxVis) : null, light:c.light || null};
    state.phase = 'feedback';
    state.reveal = 1;
    anim = state.mode === 'vn' ? 'line' : 'result';
    render(false);
    if (c.kind === 'good') popStar();
  }

  function toggle(id){
    const sc = STORY.scenes[state.at];
    const i = state.picks.indexOf(id);
    state.full = false;
    if (i >= 0) state.picks.splice(i, 1);
    else if (state.picks.length < sc.pick) state.picks.push(id);
    else state.full = true;
    render(false);
    const b = card.querySelector(`[data-id="${id}"]`); if (b) b.focus({preventScroll:true});
  }

  function zip(){
    const sc = STORY.scenes[state.at];
    if (state.picks.length !== sc.pick) return;
    state.bag = state.picks.slice();
    state.picks = []; state.full = false;
    const items = state.bag.map(itemById);
    const good = !items.some(it => it.kind === 'bad');
    state.scored++;
    if (good) state.stars++;
    const tip = sc.tip || 'A good Go Bag has a flashlight, water, a first aid kit, a whistle and a power bank. Leave out candles and gadgets.';
    state.log.push({label:'Packed: ' + items.map(it => it.name).join(', '), kind: good ? 'good' : 'bad', tip});
    state.last = {
      bag:true, kind: good ? 'good' : 'bad',
      head: good ? 'Great packing!' : 'Let’s check your bag',
      result: [good
        ? (sc.goodLine || {who:'mama', mood:'happy', say:'Great packing, anak! Our Go Bag is ready.'})
        : (sc.badLine || {who:'mama', mood:'worried', say:'Hmm, let’s check what’s in here. Some things won’t help much.'})],
      tip, next: sc.next
    };
    state.phase = 'feedback';
    state.reveal = 1;
    anim = state.mode === 'vn' ? 'line' : 'result';
    render(false);
    if (good) popStar();
  }

  function pickEnding(){
    if (STORY.special && state.flags[STORY.special.flag]) return STORY.special.ending;
    const r = state.scored ? state.stars / state.scored : 0;
    if (r >= 0.85) return 'hero';
    if (r >= 0.55) return 'safe';
    return 'lucky';
  }

  function next(){
    const to = state.last && state.last.next;
    state.last = null;
    if (to === 'END'){
      state.ending = pickEnding();
      state.at = 'end'; state.phase = 'end';
      found.add(state.ending); saveFound();
      tellLibrary({type:'end', ending:state.ending, stars:state.stars, scored:state.scored});
    } else {
      state.at = to; state.phase = 'choose'; state.reveal = 1;
    }
    render(true);
  }

  function setMode(m){
    if (m !== 'chat' && m !== 'vn') return;
    state.mode = m; saveMode();
    tellLibrary({type:'mode', mode:m});
    render(false);
    const again = document.querySelector(`.mode[data-mode="${m}"]`) || $(m === 'vn' ? 'segVn' : 'segChat');
    if (again && again.offsetParent) again.focus({preventScroll:true});
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'begin'){ state = fresh(state.mode, b.dataset.hero); state.at = STORY.start; state.phase = 'choose'; render(true); }
    else if (act === 'restart'){ state = fresh(state.mode, state.hero); if (EMBED){ state.at = STORY.start; state.phase = 'choose'; } render(true); }
    else if (act === 'exit') tellLibrary({type:'exit'});
    else if (act === 'mode') setMode(b.dataset.mode);
    else if (act === 'more') more();
    else if (act === 'skip') skip();
    else if (act === 'choose') choose(+b.dataset.i);
    else if (act === 'toggle') toggle(b.dataset.id);
    else if (act === 'zip') zip();
    else if (act === 'next') next();
  });

  function start(data){
    found = new Set(loadFound().concat((data && data.found) || []).filter(k => ORDER.includes(k)));
    const s = data && data.state;
    if (s && (s.at === 'start' || s.at === 'end' || STORY.scenes[s.at]) && 'reveal' in s && s.flags){
      state = s;
      if (state.mode !== 'vn' && state.mode !== 'chat') state.mode = loadMode();
    } else if (EMBED){
      state = fresh(Q.get('mode') === 'vn' ? 'vn' : 'chat', Q.get('hero') === 'kuya' ? 'kuya' : 'ate');
      state.at = STORY.start; state.phase = 'choose';
    } else state = fresh(loadMode());
    if (EMBED) $('backBtn').hidden = false;
    render(false);
  }
  try { window.claude?.hot?.snapshot?.(() => ({state, found:[...found]})); } catch(e){}
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
