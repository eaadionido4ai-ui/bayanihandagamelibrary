<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{background:#333;padding:20px;display:flex;flex-direction:column;gap:20px;width:1000px}
.shot{position:relative;overflow:hidden;background:#0e2233}
.minimap{position:absolute;top:12px;right:76px;width:122px;height:83px;border-radius:12px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.3)}
</style></head><body>
<div id="walk" class="shot" style="width:960px;height:600px">
  <canvas class="stage" data-view='{"dpr":1.5,"fov":55,"cam":[0.1,2.35,4.4],"look":[0.3,1.2,-6],"me":[0.5,0.9,2.52],"bayani":[2.45,-6.3,-0.3]}'></canvas>
  <div class="hud">
    <div class="tl"><span class="ib">←</span></div>
    <div class="tr"><span class="ib">⚙</span></div>
    <div class="minimap" data-map="mini"></div>
    <div class="stat" style="top:16px">🏛️ Bulwagan ng Bayanihan <em>4 of 9 seen</em></div>
    <div class="hint" style="top:66px"><span class="face"><span data-bayani style="width:36px;height:40px;margin-bottom:-3px"></span></span>Walk anywhere! Near a picture or a story stand, tap Look.</div>
    <div class="stick" style="left:24px;bottom:24px"><i></i></div>
    <div class="act" style="right:24px;bottom:36px">👀 Look</div>
  </div>
</div>
<div id="stand" class="shot" style="width:960px;height:540px">
  <canvas class="stage" data-view='{"dpr":1.5,"fov":50,"cam":[-0.15,2.8,-0.05],"look":[-2.45,0.8,-2.35],"me":[-1.72,-1.5,4.0]}'></canvas>
  <div class="hud"><div class="act" style="right:24px;bottom:30px">📖 Read</div></div>
</div>
<script src="../../public/engine/three.min.js"></script>
<script src="art.js"></script><script src="gallery.js"></script><script src="mock.js"></script>
</body></html>
